<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotarAI · Test mikrofonu i kamery</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; color: #17213d; background: #f5f7fc; margin: 0; }
main { max-width: 38rem; margin: auto; padding: 2rem 1rem; }
label, select, video, meter { display: block; width: 100%; }
label, video, meter { margin-block: .75rem; }
select, button { font: inherit; padding: .5rem; }
video { background: #17213d; max-height: 20rem; }
[hidden] { display: none !important; }
</style>
<main>
  <a href="/v2/pocket">Wróć do Pocket</a>
  <a href="/v2/nagrywanie">Otwórz nagrywanie stanowiska</a>
  <h1>Test mikrofonu i kamery</h1>
  <p>Prototyp do prób na fikcyjnych danych. Dźwięk i obraz służą tylko do podglądu na tym urządzeniu.</p>
  <label>Stanowisko
    <select id="stanowisko">
      <option value="sekretariat">Sekretariat</option>
      <option value="gabinet">Gabinet notariusza</option>
    </select>
  </label>
  <label>Mikrofon <select id="mikrofon"><option value="">Domyślny mikrofon</option></select></label>
  <label id="pole-kamery" hidden>Kamera <select id="kamera"><option value="">Domyślna kamera</option></select></label>
  <button id="uruchom" type="button">Sprawdź urządzenia</button>
  <button id="stop" type="button" disabled>Zakończ test</button>
  <meter id="poziom" aria-label="Poziom mikrofonu" min="0" max="1" value="0"></meter>
  <video id="podglad" autoplay muted playsinline hidden></video>
  <p id="stan" role="status">Urządzenia są wyłączone.</p>
</main>
<script src="/v2/urzadzenia-av.js" defer></script>
</html>
