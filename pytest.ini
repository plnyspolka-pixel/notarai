[pytest]
# Konfiguracja pytest dla pieczapp

# Wzorce plikow testowych
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opcje wyswietlania
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Katalogi ignorowane
norecursedirs = .git .venv venv dane build dist *.egg-info

# Markery (na przyszlosc)
markers =
    slow: testy wymagajace wiecej czasu
    integration: testy integracyjne
    unit: testy jednostkowe

# Ostrzezenia
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
