name: SEC-10 plaintext lifecycle / synthetic privacy gate

on:
  pull_request:
    paths:
      - 'confidential/plaintext_lifecycle.py'
      - 'confidential/retention_gate.py'
      - 'confidential/worker.py'
      - 'scripts/verify_confidential_plaintext_lifecycle.py'
      - 'confidential/Dockerfile'
      - 'test_confidential_plaintext_lifecycle.py'
      - 'test_confidential_retention_gate.py'
      - 'test_confidential_worker_lifecycle_sec10.py'
      - 'infra/notarai-confidential-task.yaml'
      - 'docs/security-evidence/SEC-10.md'
      - '.github/workflows/confidential-plaintext-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-privacy:
    name: SEC-10 six failure paths / no plaintext
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: eu-central-1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install app fixture dependencies and synthetic test requirements (NO AWS credentials)
        run: |
          grep -vE '^(faster-whisper|playwright|boto3)' requirements.txt > /tmp/notarai-sec10-core.txt
          python -m pip install -r /tmp/notarai-sec10-core.txt -r confidential/requirements.txt
          python -m pip install pytest PyYAML
      - name: Static syntax
        run: python -m py_compile confidential/plaintext_lifecycle.py confidential/worker.py scripts/verify_confidential_plaintext_lifecycle.py confidential/retention_gate.py test_confidential_plaintext_lifecycle.py test_confidential_retention_gate.py test_confidential_worker_lifecycle_sec10.py
      - name: AWS metadata audit stays offline without --check
        run: python scripts/verify_confidential_plaintext_lifecycle.py
      - name: Synthetic privacy tests
        run: python -m pytest -q test_confidential_plaintext_lifecycle.py test_confidential_retention_gate.py test_confidential_worker_lifecycle_sec10.py
      - name: Confirm no AWS session required
        run: |
          echo "SEC-10: Offline only; this workflow is NOT hardware or independent auditor evidence."

  ephemeral-runtime:
    name: SEC-10 Linux tmpfs + kernel dump guard (NO Nitro claim)
    runs-on: ubuntu-latest
    needs: synthetic-privacy
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify readonly non-root guest guard in isolated local Docker
        shell: bash
        run: |
          set -euo pipefail
          # Pull the publicly distributed test runtime before capturing guest output.
          # No AWS credentials, no guest network, no real data or host writes.
          docker pull python:3.12-slim-bookworm >/dev/null
          output="$(docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 -e PYTHONDONTWRITEBYTECODE=1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount type=bind,src="$PWD/confidential",dst=/app/confidential,readonly \
            --workdir /app --entrypoint python python:3.12-slim-bookworm \
            -c 'from confidential.plaintext_lifecycle import harden_guest_process, silence_guest_stdio; harden_guest_process(); silence_guest_stdio(); print("synthetic marker should never leave guest")' 2>&1)"
          if [ -n "$output" ]; then
            echo "::error::Guest emitted unexpected stdout/stderr (content withheld)"
            exit 1
          fi
          echo "Offline Linux guard passed; not a Nitro hardware validation"
