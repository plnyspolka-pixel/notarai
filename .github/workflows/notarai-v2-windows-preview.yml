name: NotarAI V2 Windows preview installer
on:
  pull_request:
    branches: [notarai-2.0]
    paths:
      - 'v2/installer/**'
      - 'v2/worker/**'
      - 'v2/requirements.txt'
      - '.github/workflows/notarai-v2-windows-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build the x64 EXE
        run: ./v2/installer/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/notarai-preview"
      - name: Exercise install, Pocket in Edge, and uninstall
        run: |
          python -m pip --disable-pip-version-check install -c v2/requirements.txt playwright==1.62.0 pywin32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 v2/installer/smoke_windows.py "$env:RUNNER_TEMP/notarai-preview/NotarAI-V2-Setup-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NotarAI-V2-Setup-x64
          path: ${{ runner.temp }}/notarai-preview/NotarAI-V2-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0
