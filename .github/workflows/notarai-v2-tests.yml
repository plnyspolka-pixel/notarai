name: NotarAI V2 tests
on:
  push:
    branches: [notarai-2.0]
    paths:
      - 'v2/**'
      - '.github/workflows/notarai-v2-tests.yml'
  pull_request:
    branches: [notarai-2.0]
    paths:
      - 'v2/**'
      - 'taksa.py'
      - 'slownie.py'
      - '.github/workflows/notarai-v2-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Verify Microsoft WinApp CLI and enable the synthetic Windows test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP winappcli-x64.zip
          $destination = Join-Path $env:RUNNER_TEMP winappcli-v0.8.0
          $sha256 = '67a8e1d39421a5ef5309c7017327c6a70ea6215a0e56e47ec22a7e9ec3b914e6'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winappCli/releases/download/v0.8.0/winappcli-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha256) {
            throw 'WinApp CLI release archive failed its SHA-256 check'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $winapp = Join-Path $destination winapp.exe
          $version = (Get-Item -LiteralPath $winapp).VersionInfo.ProductVersion
          if ($version -ne '0.8.0') {
            throw "Unexpected WinApp CLI product version $version"
          }
          & $winapp --version
          if ($LASTEXITCODE -ne 0) {
            throw "WinApp CLI --version failed with exit code $LASTEXITCODE"
          }
          "NOTARAI_V2_TEST_WINAPP=$winapp" >> $env:GITHUB_ENV
      - name: Enable the LibreOffice Writer interoperability test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version
          echo "NOTARAI_V2_TEST_SOFFICE=$(command -v soffice)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relay unit tests
        run: node --test relay/relay.test.mjs
      - name: Fill a real Windows program through UI Automation
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"NOTARAI_V2_TEST_UIA=1" >> $env:GITHUB_ENV'
      - run: python -m pytest -q -rs
      - name: Pocket and workstation panel in a real browser (fake model, local relay)
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/e2e" playwright@1.62.0
          NODE_PATH="$RUNNER_TEMP/e2e/node_modules" npx --prefix "$RUNNER_TEMP/e2e" playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/e2e/node_modules" node tests/e2e/pocket.e2e.js python
      - name: Verify the V2 service through Windows SCM
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        env:
          NOTARAI_V2_TEST_SCM: '1'
        run: python -m pytest -q -rP tests/test_windows_scm.py
