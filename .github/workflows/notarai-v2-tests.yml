name: NotarAI V2 tests
on:
  push:
    branches: [notarai-2.0]
    paths:
      - 'v2/**'
      - '.github/workflows/notarai-v2-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
