name: Koder - agent kodujacy na wynajetym GPU

# Uruchamia sie po wypchnieciu galezi koder/*. Calosc dziala w chmurze: runner GitHuba
# wynajmuje karte na SaladCloud, stawia na niej model (vLLM), wykonuje zadania z
# docs/agent-tasks/ZLECENIE.txt w odizolowanych kontenerach, odklada galezie agent/* do
# przegladu i na koniec zawsze usuwa karte. Niczego nie scala i niczego nie wdraza.
on:
  push:
    branches: ["koder/**"]

permissions:
  contents: write   # tylko wypchniecie galezi agent/* (GITHUB_TOKEN nie zmienia workflowow)
  id-token: write   # OIDC do roli notarai-github-koder (odczyt jednego sekretu)

concurrency:
  group: koder
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_DEFAULT_REGION: eu-central-1
  AWS_EC2_METADATA_DISABLED: "true"
  KODER_ROLE: arn:aws:iam::127621462971:role/notarai-github-koder
  KODER_MODEL: RedHatAI/Qwen3.8-27B-INT4
  KODER_MINUTES: "120"
  KODER_MAX_USD: "1.5"
  KODER_PARALLEL: "3"   # ile zadan naraz na jednej karcie
  NOTARAI_SALAD_ENV: /home/runner/work/_temp/salad.env

jobs:
  koder:
    name: Zadania na modelu z SaladCloud
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Kontrola kart zadan (bez kart dla agenta nie wynajmujemy karty)
        run: |
          python3 tools/agent_factory/koder/karta.py lint || true
          if ! grep -lE '^tor: koder' docs/agent-tasks/kolejka/*.md > /dev/null 2>&1; then
            echo "Brak kart o torze koder w docs/agent-tasks/kolejka - koncze bez kosztow"; exit 1
          fi

      - name: Klucz dostawcy GPU z Secrets Manager (OIDC, bez kluczy AWS w repo)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$KODER_ROLE" \
            --role-session-name "koder-$GITHUB_RUN_ID" --web-identity-token "$TOKEN" \
            --duration-seconds 900 --query Credentials --output json)
          export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$CREDS")
          export AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$CREDS")
          export AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$CREDS")
          SECRET=$(aws secretsmanager get-secret-value --secret-id notarai/salad \
            --query SecretString --output text)
          echo "::add-mask::$(jq -r .SALAD_API_KEY <<<"$SECRET")"
          umask 077
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SECRET" > "$NOTARAI_SALAD_ENV"

      - name: Zbuduj obraz robotnika i sprawdz go na sucho (zanim zaczniemy placic za karte)
        run: |
          set -uo pipefail
          docker build -q -t koder-agent -f tools/agent_factory/koder/Dockerfile .
          docker run --rm --network none -e MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT=1 \
            -v "$PWD/tools/agent_factory/koder:/cfg:ro" koder-agent \
            timeout 120 mini -c mini.yaml -c /cfg/mini.yaml -y --exit-immediately \
            -t "proba" -o /tmp/p.traj.json < /dev/null > "$RUNNER_TEMP/sucho.log" 2>&1 || true
          tail -n 12 "$RUNNER_TEMP/sucho.log" | cut -c1-300
          if grep -qE "EOFError|No such option|Usage: mini|ValidationError|ModuleNotFoundError" "$RUNNER_TEMP/sucho.log"; then
            echo "Robotnik nie startuje bez pytan - przerywam przed wynajmem karty"; exit 1
          fi

      - name: Wynajmij karte i uruchom model
        run: |
          python3 tools/agent_factory/salad_vllm.py up --pay --model "$KODER_MODEL" \
            --minutes "$KODER_MINUTES" --max-usd "$KODER_MAX_USD"

      - name: Brama do modelu w wewnetrznej sieci Dockera
        run: |
          set -euo pipefail
          docker network create --internal kodernet
          docker run -d --name brama -e NOTARAI_SALAD_ENV=/run/salad.env -e PYTHONUNBUFFERED=1 \
            -v "$NOTARAI_SALAD_ENV:/run/salad.env:ro" -v "$PWD:/src" -w /src \
            public.ecr.aws/docker/library/python:3.12-slim \
            python tools/agent_factory/salad_vllm.py proxy --bind 0.0.0.0 --port 8000
          docker network connect --alias brama kodernet brama
          for i in $(seq 1 180); do
            if docker logs brama 2>&1 | grep -q "GOTOWE"; then echo "model gotowy"; exit 0; fi
            if ! docker ps -q -f name=brama | grep -q .; then break; fi
            sleep 15
          done
          docker logs brama 2>&1 | tail -n 30
          exit 1

      - name: Wykonaj zadania
        run: bash tools/agent_factory/koder/przebieg.sh

      - name: Usun karte (zawsze)
        if: always()
        run: |
          docker logs brama 2>&1 | grep -v "^proxy " | tail -n 20 || true
          docker rm -f brama > /dev/null 2>&1 || true
          if [ -f "$NOTARAI_SALAD_ENV" ]; then python3 tools/agent_factory/salad_vllm.py down || true; fi
          rm -f "$NOTARAI_SALAD_ENV"

      - name: Zapisz wyniki na galezi agent/<przebieg>-wyniki
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/wyniki"
          if [ ! -d "$OUT" ]; then exit 0; fi
          DEST="docs/agent-tasks/wyniki/$GITHUB_RUN_ID"
          git checkout -q -b "agent/$GITHUB_RUN_ID-wyniki"
          mkdir -p "$DEST" && cp -r "$OUT"/. "$DEST"/
          git add -f "$DEST"
          git -c user.name="koder (agent)" -c user.email="koder@users.noreply.github.com" \
            commit -q -m "koder: wyniki przebiegu $GITHUB_RUN_ID ($KODER_MODEL)"
          git push -q origin "agent/$GITHUB_RUN_ID-wyniki"
          cat "$OUT/WYNIKI.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
