name: SEC-86 customer Nitro attestation (synthetic only)
on:
  pull_request:
    paths:
      - 'confidential/customer_nitro_attestation.py'
      - 'confidential/customer_attested_release.py'
      - 'confidential/customer_guest_v3.py'
      - 'confidential/nsm_recipient.py'
      - 'scripts/customer_attested_release.py'
      - 'test_customer_attestation.py'
      - 'test_customer_guest_v3.py'
      - 'test_customer_release.py'
      - '.github/workflows/confidential-customer-attestation.yml'
  push:
    branches:
      - 'feature/sec86-customer-attested-release-20261122'
permissions:
  contents: read
jobs:
  offline-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit test dependencies
        run: python -m pip install 'cryptography>=42,<51' 'cbor2==6.1.5' 'pytest>=8,<10' 'asn1crypto==1.5.1'
      - name: Compile and synthetic security regression (NO AWS)
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
        run: |
          python -m compileall -q confidential/customer_nitro_attestation.py confidential/customer_attested_release.py confidential/customer_guest_v3.py scripts/customer_attested_release.py
          python -m pytest -q --noconftest test_customer_release.py test_customer_attestation.py test_customer_guest_v3.py
