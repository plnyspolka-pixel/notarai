name: Worker Army - Scale Corpus Preflight

on:
  push:
    branches:
      - feature/agent-factory-learning-loop-20261116
    paths:
      - ".github/workflows/worker-scale-preflight.yml"
      - "tools/agent_factory/worker_scale_*.py"
      - "tests/test_worker_scale_*.py"
  pull_request:
    paths:
      - ".github/workflows/worker-scale-preflight.yml"
      - "tools/agent_factory/worker_scale_*.py"
      - "tests/test_worker_scale_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-scale-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project test dependencies without heavy optional models
        run: |
          grep -vE '^(faster-whisper|playwright)' requirements.txt > /tmp/worker-scale-deps.txt
          python -m pip install -r /tmp/worker-scale-deps.txt
      - name: Compile and validate 200 public contracts + 1600 withheld-from-model oracle cases
        run: |
          mkdir -p scale-preflight
          python -m compileall -q tools/agent_factory/worker_scale_*.py
          python -m tools.agent_factory.worker_scale_corpus | tee scale-preflight/summary.json
          python -m pytest -q tests/test_worker_scale_*.py | tee scale-preflight/tests.txt
      - name: Store offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-scale-preflight-${{ github.run_id }}
          path: scale-preflight/
          retention-days: 30
          if-no-files-found: warn
