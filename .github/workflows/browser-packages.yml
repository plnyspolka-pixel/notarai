name: Browser extension packages
on:
  pull_request:
    paths:
      - 'rozszerzenie/**'
      - '.github/workflows/browser-packages.yml'
  push:
    branches: [master]
    paths:
      - 'rozszerzenie/**'
      - '.github/workflows/browser-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: rozszerzenie
      - run: python3 rozszerzenie/build_stores.py
      - uses: actions/upload-artifact@v4
        with:
          name: notarai-browser-store-packages
          path: dist/browser/*.zip
          if-no-files-found: error
