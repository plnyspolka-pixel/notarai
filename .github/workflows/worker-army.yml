name: Worker Army - MCP and learning loop

on:
  push:
    branches:
      - feature/agent-factory-learning-loop-20261116
    paths:
      - ".github/workflows/worker-army.yml"
      - ".mcp.json"
      - "tools/agent_factory/worker_pool.py"
      - "tools/agent_factory/worker_mcp.py"
      - "tools/agent_factory/learning_loop.py"
      - "tests/test_worker_pool_mcp.py"
      - "tests/test_learning_loop.py"
      - "docs/agent-factory-research/WORKER_ARMY_LEARNING_LOOP.md"
  pull_request:
    paths:
      - ".github/workflows/worker-army.yml"
      - ".mcp.json"
      - "tools/agent_factory/worker_pool.py"
      - "tools/agent_factory/worker_mcp.py"
      - "tools/agent_factory/learning_loop.py"
      - "tests/test_worker_pool_mcp.py"
      - "tests/test_learning_loop.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-and-training-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application test dependencies without optional local models
        run: |
          grep -vE '^(faster-whisper|playwright)' requirements.txt > /tmp/worker-army-ci-requirements.txt
          python -m pip install -r /tmp/worker-army-ci-requirements.txt
      - name: Compile worker and learning modules
        run: |
          python -m compileall -q tools/agent_factory/worker_pool.py tools/agent_factory/worker_mcp.py tools/agent_factory/learning_loop.py
      - name: Test delegation guardrails, MCP contract and trusted training corpus
        run: |
          python -m pytest -q tests/test_worker_pool_mcp.py tests/test_learning_loop.py
      - name: Verify stdio MCP handshake and tool discovery without a model
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          messages = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
              {"jsonrpc": "2.0", "id": 3, "method": "tools/call",
               "params": {"name": "worker_pool_status", "arguments": {}}}
          ]
          result = subprocess.run(
              [sys.executable, "-m", "tools.agent_factory.worker_mcp"],
              input="".join(json.dumps(m) + "\n" for m in messages),
              text=True, capture_output=True, timeout=10, check=True)
          answers = [json.loads(x) for x in result.stdout.splitlines()]
          assert [a["id"] for a in answers] == [1, 2, 3]
          assert len(answers[1]["result"]["tools"]) == 3
          assert json.loads(answers[2]["result"]["content"][0]["text"])["enabled"] is False
          print("MCP tool discovery verified; no GPU, model or external calls.")
          PY
