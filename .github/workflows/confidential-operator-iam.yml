name: SEC-02 - operator IAM offline controls
on:
  pull_request:
    paths:
      - 'infra/notarai-confidential-operator-iam.yaml'
      - 'confidential/operator_iam_controls.py'
      - 'test_confidential_operator_iam_controls.py'
      - 'scripts/confidential_operator_iam_evidence.py'
      - 'scripts/confidential_operator_iam_source_inventory.py'
      - '.github/workflows/confidential-operator-iam.yml'
      - 'infra/notarai-confidential-github.yaml'
  push:
    branches:
      - 'plan/confidential-sec-02-operator-iam-org-20261122'
    paths:
      - 'infra/notarai-confidential-operator-iam.yaml'
      - 'confidential/operator_iam_controls.py'
      - 'test_confidential_operator_iam_controls.py'
      - '.github/workflows/confidential-operator-iam.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sec02-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  synthetic-deny:
    name: Offline 6 denies and independence gates (NOT live AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project test dependencies (exclude browsers and local speech models)
        run: |
          grep -vE '^(faster-whisper|playwright)' requirements.txt > /tmp/notarai-requirements-sec02.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/notarai-requirements-sec02.txt
      - name: Exact SEC-02 acceptance command
        run: python -m pytest -q test_confidential_operator_iam_controls.py
      - name: Generate deterministic redacted source-only privilege inventory
        run: |
          python -m scripts.confidential_operator_iam_source_inventory \
            --output sec02-source-inventory.json --summary
      - name: Save source graph for security reviewers
        uses: actions/upload-artifact@v4
        with:
          name: sec02-source-inventory
          path: sec02-source-inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: Evidence limitations
        run: |
          {
            echo '### SEC-02 synthetic checks only'
            echo 'No actual IAM/STS denial or AWS account ownership evidence was collected.'
            echo 'K4/K6 remain BLOCKED pending independent AWS review.'
            echo 'No AWS deployment, plaintext or AUTO submission.'
          } >> "$GITHUB_STEP_SUMMARY"
