# Render scenografii Blender (Cycles CPU) na runnerach GitHuba: jeden job na plan zdjęciowy,
# wynik (JPG, mapy głębi, najazd MP4, .blend, opis.json) wraca commitem na gałąź z [skip ci].
# Zasoby CC0 z Poly Haven pobiera scenografia/pobierz_zasoby.py (nie ma ich w repo).
name: Scenografia - render

on:
  push:
    branches: ["scenografia/**"]
    paths:
      - "scenografia/sety/**"
      - "scenografia/wspolne.py"
      - "scenografia/zbuduj.py"
      - "scenografia/manifest.json"
      - ".github/workflows/scenografia-render.yml"
  workflow_dispatch:
    inputs:
      plany:
        description: "Plany po przecinku (np. s01,s03)"
        default: "s01,s03,s04,s05,s06,s07,s08,s09,s10"

concurrency:
  group: scenografia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lista:
    runs-on: ubuntu-24.04
    outputs:
      plany: ${{ steps.p.outputs.plany }}
    steps:
      - id: p
        env:
          PLANY: ${{ inputs.plany || 's01,s03,s04,s05,s06,s07,s08,s09,s10' }}
        run: echo "plany=$(python3 -c "import json,os;print(json.dumps([p.strip() for p in os.environ['PLANY'].split(',') if p.strip()]))")" >> "$GITHUB_OUTPUT"

  render:
    needs: lista
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        plan: ${{ fromJson(needs.lista.outputs.plany) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Zależności
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q bpy==5.3.0 OpenEXR numpy pillow
      - uses: actions/cache@v4
        with:
          path: scenografia/.cache
          key: zasoby-${{ hashFiles('scenografia/manifest.json') }}
      - name: Zasoby CC0
        run: python scenografia/pobierz_zasoby.py
      - name: Kontrola siedzisk i rzut z góry ${{ matrix.plan }}
        run: python scenografia/zbuduj.py --plan ${{ matrix.plan }} --rzut
      - name: Render ${{ matrix.plan }}
        run: python scenografia/zbuduj.py --plan ${{ matrix.plan }}
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.plan }}
          path: |
            scenografia/rendery/${{ matrix.plan }}
            scenografia/blend/${{ matrix.plan }}.blend
          if-no-files-found: error
          retention-days: 14

  zapisz:
    needs: render
    # nie po anulowaniu (nie commitujemy niepełnych/starych scen); po częściowej porażce zapisuje to, co się udało
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: render-*
          path: wyniki
      - name: Commit renderów
        run: |
          for d in wyniki/render-*; do
            p="${d#wyniki/render-}"
            mkdir -p "scenografia/rendery/$p" scenografia/blend
            [ -d "$d/rendery/$p" ] && cp -r "$d/rendery/$p/." "scenografia/rendery/$p/"
            [ -f "$d/blend/$p.blend" ] && [ "$(stat -c%s "$d/blend/$p.blend")" -lt 15000000 ] && cp "$d/blend/$p.blend" scenografia/blend/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenografia/rendery scenografia/blend
          git diff --cached --quiet && exit 0
          git commit -m "scenografia: rendery z CI [skip ci]"
          git push
