name: NotarAI - strona notarai.pl

# Po kazdym zielonym przebiegu testow na master: generuje strone (katalog
# kancelarii, blog, sitemap) i wysyla na hosting az.pl przez FTPS - tylko
# pliki, ktore sie zmienily od ostatniej publikacji (manifest skrotow na
# serwerze). Nie trzeba uruchamiac infra\strona.ps1 recznie.
# Recznie: Actions -> "NotarAI - strona notarai.pl" -> Run workflow (master).
#
# Haslo FTPS z AWS Secrets Manager (notarai/strona-ftp) przez role OIDC
# notarai-github-wdrozenie - bez kluczy w GitHubie. Uprawnienie do sekretu
# dodaje infra/4-polacz-github.ps1 (stos notarai-github).

on:
  workflow_run:
    workflows: ["NotarAI - testy kodu"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: notarai-strona
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_DEFAULT_REGION: eu-central-1
  AWS_KONTO: "127621462971"
  ROLA_GITHUB: arn:aws:iam::127621462971:role/notarai-github-wdrozenie

jobs:
  strona:
    name: Generowanie + wysylka FTPS
    runs-on: ubuntu-latest
    # Pierwsza pelna wysylka (ok. 640 plikow) trwa dluzej; kolejne to minuty.
    timeout-minutes: 90
    if: >-
      github.ref == 'refs/heads/master' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master'
        )
      )
    steps:
      - name: Pobierz kod (dokladnie przetestowany commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generuj katalog kancelarii, blog i sitemap
        run: |
          set -euo pipefail
          python -I seo/generuj.py
          python seo/blog.py zbuduj
          # Serial: tylko odcinki, ktorych premiera juz minela (czas Europe/Warsaw); po sitemap.
          python -I seo/serial.py zbuduj
          python -I scripts/buduj_pobieranie.py
          for plik in index.html notariusz/index.html blog/index.html sitemap.xml kalkulator/index.html serial/index.html serial/rss.xml; do
            test -f "strona/$plik" || { echo "::error::Brak strona/$plik"; exit 1; }
          done

      - name: Poswiadczenia AWS przez OIDC
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$token"
          if ! dane=$(aws sts assume-role-with-web-identity \
                --role-arn "$ROLA_GITHUB" \
                --role-session-name "github-strona-${GITHUB_RUN_ID}" \
                --web-identity-token "$token" \
                --duration-seconds 3600 \
                --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text); then
            echo "::error::Brak dostepu do roli $ROLA_GITHUB. Uruchom raz na komputerze: powershell -ExecutionPolicy Bypass -File infra\\4-polacz-github.ps1"
            exit 1
          fi
          read -r kid ksec ksesja <<< "$dane"
          echo "::add-mask::$ksec"
          echo "::add-mask::$ksesja"
          {
            echo "AWS_ACCESS_KEY_ID=$kid"
            echo "AWS_SECRET_ACCESS_KEY=$ksec"
            echo "AWS_SESSION_TOKEN=$ksesja"
          } >> "$GITHUB_ENV"
          konto=$(AWS_ACCESS_KEY_ID=$kid AWS_SECRET_ACCESS_KEY=$ksec AWS_SESSION_TOKEN=$ksesja \
            aws sts get-caller-identity --query Account --output text)
          if [ "$konto" != "$AWS_KONTO" ]; then
            echo "::error::AWS wskazuje konto $konto, oczekiwane $AWS_KONTO."
            exit 1
          fi

      - name: Wyslij zmienione pliki na az.pl (FTPS)
        run: |
          set -euo pipefail
          # Haslo tylko w zmiennej tego jednego kroku, zamaskowane w logach.
          if ! sekret=$(aws secretsmanager get-secret-value --secret-id notarai/strona-ftp \
                --query SecretString --output text); then
            echo "::error::Brak odczytu notarai/strona-ftp. Zaktualizuj role: powershell -ExecutionPolicy Bypass -File infra\\4-polacz-github.ps1"
            exit 1
          fi
          haslo=$(printf '%s' "$sekret" | jq -r '.password // empty')
          unset sekret
          if [ -z "$haslo" ]; then echo "::error::W sekrecie brak pola password."; exit 1; fi
          echo "::add-mask::$haslo"
          mkdir -p "$RUNNER_TEMP/kopia"
          # 4 polaczenia naraz; manifest zapisywany co 50 plikow, wiec
          # przerwana wysylka rusza przy nastepnym uruchomieniu od miejsca przerwania.
          NOTARAI_FTP_WATKI=4 NOTARAI_FTP_HASLO="$haslo" python -I infra/strona_ftp.py wyslij-zmiany strona auto "$RUNNER_TEMP/kopia" \
            | tee "$RUNNER_TEMP/wysylka.txt"
          unset haslo
          {
            echo "### Strona notarai.pl"
            grep -E '^  plikow strony' "$RUNNER_TEMP/wysylka.txt" || true
            echo '```'
            grep -E '^  wyslano ' "$RUNNER_TEMP/wysylka.txt" | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kopia nadpisanych plikow (30 dni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strona-kopia-${{ github.run_id }}
          path: ${{ runner.temp }}/kopia
          retention-days: 30
          if-no-files-found: ignore

      - name: Sprawdz, czy notarai.pl serwuje nowa wersje
        run: |
          set -euo pipefail
          oczekiwany=$(sha256sum strona/index.html | cut -d' ' -f1)
          for proba in 1 2 3 4 5 6; do
            jest=$(curl -sSfL -H 'Cache-Control: no-cache' "https://notarai.pl/index.html?v=${GITHUB_RUN_ID}-${proba}" | sha256sum | cut -d' ' -f1 || true)
            if [ "$jest" = "$oczekiwany" ]; then
              echo "notarai.pl serwuje aktualny index.html"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://notarai.pl/index.html rozni sie od strona/index.html po wysylce."
          exit 1
