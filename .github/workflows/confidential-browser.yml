name: NotarAI Confidential Browser - chromium smoke

on:
  pull_request:
    paths:
      - 'confidential/**'
      - 'static/confidential-crypto.js'
      - 'static/confidential-auto.js'
      - 'test_confidential_auto_js.js'
      - 'static/index.html'
      - 'test_confidential*.py'
      - 'infra/notarai-confidential*.yaml'
      - 'scripts/render_confidential_*.py'
      - 'scripts/confidential_pilot_*.py'
      - 'scripts/package_confidential_dispatch.py'
      - 'scripts/verify_confidential_private_network.py'
      - 'scripts/verify_confidential_shared_fabric.py'
      - 'scripts/verify_confidential_operator_boundary.py'
      - 'scripts/verify_confidential_release.py'
      - 'scripts/custodian_sign_confidential_release.py'
      - 'scripts/audit_confidential_pilot.py'
      - '.github/workflows/confidential-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Chromium Playwright (fikcyjne dane)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalacja bibliotek workera i zaleznosci aplikacji do testow
        run: |
          grep -vE '^(faster-whisper|playwright|boto3)' requirements.txt > /tmp/notarai-core-ci.txt
          python -m pip install -r /tmp/notarai-core-ci.txt -r confidential/requirements.txt pytest PyYAML cfn-lint
      - name: Walidacja szablonow CloudFormation
        run: |
          cfn-lint --regions eu-central-1 --template \
            infra/notarai-confidential-capacity-base.yaml \
            infra/notarai-confidential-private-egress.yaml \
            infra/notarai-confidential-shared-fabric.yaml \
            infra/notarai-confidential-shared-capacity.yaml \
            infra/notarai-confidential-external-custody-kms.yaml \
            infra/notarai-confidential-custody-signing.yaml \
            infra/notarai-confidential-job-ledger.yaml \
            infra/notarai-confidential-network-base.yaml \
            infra/notarai-confidential-artifacts.yaml \
            infra/notarai-confidential-dispatch.yaml \
            infra/notarai-confidential-approval-ledger.yaml \
            infra/notarai-confidential-demo-kms.yaml \
            infra/notarai-confidential-ecr.yaml \
            infra/notarai-confidential-github.yaml \
            infra/notarai-confidential-staging.yaml
          # Current cfn-lint resource schema has not yet shipped AWS' new
          # TrustedExecutionConfiguration, although CloudFormation officially supports it.
          # Ignore E3002 ONLY for the Nitro task template. Unit tests assert
          # that the precise expected property is present.
          cfn-lint --regions eu-central-1 --ignore-checks E3002 \
            --template infra/notarai-confidential-task.yaml
      - name: Offline smoke CLI pilota (bez AWS)
        run: python scripts/confidential_pilot_run.py --help >/dev/null
      - name: Dry-run parametry sieci prywatnej (bez AWS)
        run: python scripts/verify_confidential_private_network.py --help >/dev/null
      - name: Weryfikator wspolnej sieci i endpointow (bez AWS)
        run: |
          python scripts/verify_confidential_shared_fabric.py --help >/dev/null
          python scripts/render_confidential_shared_capacity.py --help >/dev/null
      - name: Weryfikator niezaleznego kustosza klucza (offline)
        run: python scripts/verify_confidential_operator_boundary.py --help >/dev/null
      - name: Kontrola podpisow niezaleznego kustosza (bez AWS)
        run: |
          python scripts/custodian_sign_confidential_release.py --help >/dev/null
          python scripts/verify_confidential_release.py --help >/dev/null
      - name: Sprawdz read-only audit pilota (bez AWS)
        run: python scripts/audit_confidential_pilot.py --help >/dev/null
      - name: Wytworz weryfikowalny pakiet Lambda (offline)
        run: python scripts/package_confidential_dispatch.py --output /tmp/notarai-confidential-dispatch.zip
      - name: Przeglądarka Chromium
        run: python -m playwright install --with-deps chromium
      - name: Testy kryptografii, formularzy i szablonów AWS
        run: python -m pytest -q test_confidential.py test_confidential_worker.py test_confidential_interop.py test_confidential_infra.py test_confidential_preflight.py test_confidential_dispatch.py test_confidential_approval.py test_confidential_auto.py test_confidential_egress.py test_confidential_job_ledger.py test_confidential_audit.py test_confidential_shared_fabric.py test_confidential_operator_boundary.py test_confidential_release_approval.py test_confidential_custody_launch.py
      - name: Kontrola JS trybu AUTO (bez połączeń zewnętrznych)
        run: |
          node --check static/confidential-auto.js
          node test_confidential_auto_js.js
      - name: End-to-end Playwright na lokalnym fikcyjnym formularzu
        run: python -m confidential.demo_browser

  guest-image-smoke:
    name: Obraz Nitro guest / Chromium (test lokalny)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Zbuduj produkcyjny obraz workera bez wysyłania do AWS
        run: docker build --file confidential/Dockerfile --tag notarai-confidential:smoke .
      - name: Uruchom Chromium na fikcyjnym formularzu wewnątrz kontenera
        run: |
          docker run --rm \
            --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --entrypoint python \
            notarai-confidential:smoke -m confidential.demo_browser
      - name: Zweryfikuj, że worker odmawia pracy bez prawdziwej atestacji
        run: |
          if docker run --rm --network none \
            --entrypoint python \
            notarai-confidential:smoke -m confidential.worker; then
            echo "::error::Worker zadziałał bez sprzętowej atestacji!"
            exit 1
          fi
