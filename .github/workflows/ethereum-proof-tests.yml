name: NotarAI Ethereum proof engine
on:
  push:
    branches: [wdrazamy-ethereum]
  pull_request:
    paths:
      - 'proof_engine.py'
      - 'dowody_ethereum.py'
      - 'test_proof_engine.py'
      - '.github/workflows/ethereum-proof-tests.yml'
jobs:
  proof-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      # Repository-wide conftest imports AWS modules; run pure crypto tests in isolation.
      - run: |
          mkdir -p "$RUNNER_TEMP/notarai-proof-tests"
          cp proof_engine.py test_proof_engine.py "$RUNNER_TEMP/notarai-proof-tests/"
          cd "$RUNNER_TEMP/notarai-proof-tests"
          python -m pytest -q
      - run: python -m py_compile proof_engine.py dowody_ethereum.py
