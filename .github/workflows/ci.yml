name: NotarAI - testy kodu

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python + JS + testy regresyjne
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Instaluj zaleznosci bez opcjonalnych lokalnych modeli / przegladarki
        run: |
          grep -vE '^(faster-whisper|playwright)' requirements.txt > /tmp/notarai-requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/notarai-requirements-ci.txt
      - name: Kompilacja modulow Python
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|dane|build|dist)/' .
      - name: Sprawdz skladnie skryptow i HTML
        run: |
          node --check static/kokpit.js
          node --check static/rezerwacje-hurtowe.js
          node --check static/hurtowe.js
          python scripts/check_frontend.py
      - name: Testy automatyczne (bez AWS i danych klientow)
        run: python -m pytest -q

  powershell:
    name: Parser Windows PowerShell 5.1 (skrypty FTPS)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7
      - name: Sprawdz parserem PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('infra/2-zbuduj-obraz.ps1', 'infra/3-wdroz-aplikacje.ps1', 'infra/wydaj-rezerwacje.ps1', 'infra/strona.ps1', 'infra/wyslij-rezerwacje-bez-pythona.ps1', 'infra/publikuj-sekcje-b2b-az.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$file : $($_.Message) (linia $($_.Extent.StartLineNumber))" }
              exit 1
            }
            Write-Host "OK: $file"
          }
