<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- pieczapp: osiol stajacy deba. Rysunek wlasny z prostych ksztaltow. -->
  <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- tulow, prawie pionowy -->
    <ellipse cx="44" cy="62" rx="13" ry="24" transform="rotate(-20 44 62)"/>
    <!-- szyja -->
    <path d="M46 40 L60 20 L70 26 L58 46 Z"/>
    <!-- glowa i pysk, skierowane w prawo -->
    <ellipse cx="66" cy="19" rx="9" ry="8"/>
    <ellipse cx="79" cy="26" rx="10" ry="6" transform="rotate(30 79 26)"/>
    <!-- uszy: dlugie, rozstawione - znak rozpoznawczy osla -->
    <ellipse cx="57" cy="7" rx="3.2" ry="10" transform="rotate(-25 57 7)"/>
    <ellipse cx="68" cy="5" rx="3.2" ry="10" transform="rotate(5 68 5)"/>
    <!-- grzywa szczotkowata -->
    <path d="M58 12 l-7 6 l4 3 l-4 7 l5 1 l-1 6 l5-2 z"/>
    <!-- przednie nogi: kolano w gore, kopyto w dol i do przodu -->
    <path d="M48 44 C54 36 62 34 70 38" fill="none" stroke-width="6"/>
    <path d="M70 38 L74 47" fill="none" stroke-width="5"/>
    <path d="M42 52 C48 46 56 46 62 52" fill="none" stroke-width="6"/>
    <path d="M62 52 L64 62" fill="none" stroke-width="5"/>
    <!-- tylne nogi na ziemi, lekko ugiete -->
    <path d="M36 80 C32 84 30 90 30 95" fill="none" stroke-width="6.5"/>
    <path d="M30 95 L23 96" fill="none" stroke-width="5"/>
    <path d="M50 82 C50 87 50 91 52 95" fill="none" stroke-width="6.5"/>
    <path d="M52 95 L59 96" fill="none" stroke-width="5"/>
    <!-- ogon: od zadu w dol, z kitka -->
    <path d="M32 66 C22 68 16 76 16 86" fill="none" stroke-width="3"/>
    <ellipse cx="15" cy="88" rx="4" ry="6" transform="rotate(10 15 88)"/>
  </g>
  <circle cx="68" cy="17" r="2" fill="var(--tlo,#faf9f5)"/>
  <circle cx="86" cy="29" r="1.4" fill="var(--tlo,#faf9f5)"/>
</svg>
