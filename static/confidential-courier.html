<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>NotarAI — odbiór zaszyfrowanego dokumentu</title>
<style>body{font:16px system-ui,sans-serif;max-width:620px;margin:2rem auto;padding:1rem;color:#183144}label{display:grid;gap:8px;margin:1rem 0}input{font:inherit;padding:.7rem}button{font:inherit;padding:.8rem 1rem;background:#175985;border:0;border-radius:5px;color:white}button:disabled{opacity:.5}p{line-height:1.5}</style>
<script src="/static/confidential-courier.js" defer></script>
</head><body>
<h1>Import zaszyfrowanego dokumentu</h1>
<p>Wybierz wyłącznie plik <code>.encrypted.json</code> utworzony przez niezależnie zweryfikowanego klienta szyfrującego. Nie wybieraj tutaj oryginalnego dokumentu.</p>
<label>Plik zaszyfrowanej koperty<input type="file" id="encrypted" accept=".json,application/json"></label>
<button id="store" type="button">Zapisz ciphertext w kancelarii</button>
<button id="preview" type="button" disabled>Uruchom podgląd bez wysyłania</button>
<p id="status" role="status" aria-live="polite"></p>
</body></html>
