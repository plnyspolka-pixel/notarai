AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai V2 - przekaznik miedzy telefonem a stanowiskiem kancelarii (eu-central-1).
  API Gateway WebSocket + jedna funkcja Lambda. Przekaznik przekazuje ramki
  zaszyfrowane miedzy urzadzeniem a stanowiskiem i nie potrafi ich odczytac.
  Tabela DynamoDB trzyma wylacznie identyfikatory polaczen (bez tresci, bez danych
  osobowych) i czysci je po 3 godzinach. Logi nie zawieraja ramek.

Parameters:
  PaczkaBucket:
    Type: String
    Description: Bucket z paczka kodu funkcji (v2/relay spakowane do zip)
  PaczkaKlucz:
    Type: String
    Description: Klucz obiektu zip z kodem funkcji
  LimitNaSekunde:
    Type: Number
    Default: 200
    Description: Limit wiadomosci na sekunde dla calego przekaznika

Resources:
  TabelaPolaczen:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: notarai-v2-przekaznik
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  RolaFunkcji:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-v2-przekaznik
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: notarai-v2-przekaznik
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt TabelaPolaczen.Arn
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/@connections/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DziennikFunkcji.Arn

  DziennikFunkcji:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/notarai-v2-przekaznik
      RetentionInDays: 14

  Funkcja:
    Type: AWS::Lambda::Function
    DependsOn: DziennikFunkcji
    Properties:
      FunctionName: notarai-v2-przekaznik
      Description: Przekazuje zaszyfrowane ramki miedzy urzadzeniem a stanowiskiem
      Runtime: nodejs22.x
      Handler: lambda.handler
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt RolaFunkcji.Arn
      Code:
        S3Bucket: !Ref PaczkaBucket
        S3Key: !Ref PaczkaKlucz
      Environment:
        Variables:
          TABLE: !Ref TabelaPolaczen

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: notarai-v2-przekaznik
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  Integracja:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Funkcja.Arn}/invocations"

  TrasaPolaczenia:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $connect
      Target: !Sub "integrations/${Integracja}"

  TrasaRozlaczenia:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $disconnect
      Target: !Sub "integrations/${Integracja}"

  TrasaDomyslna:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub "integrations/${Integracja}"

  Etap:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [TrasaPolaczenia, TrasaRozlaczenia, TrasaDomyslna]
    Properties:
      ApiId: !Ref Api
      StageName: v1
      AutoDeploy: true
      DefaultRouteSettings:
        # Bez logowania tresci i bez sladu wykonania: ramki nie trafiaja do CloudWatch.
        DataTraceEnabled: false
        LoggingLevel: "OFF"
        ThrottlingRateLimit: !Ref LimitNaSekunde
        ThrottlingBurstLimit: !Ref LimitNaSekunde

  ZgodaNaWywolanie:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funkcja
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

Outputs:
  AdresPrzekaznika:
    Description: Wpisz w panelu stanowiska jako adres przekaznika
    Value: !Sub "wss://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1"
