AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  pieczapp - uzytkownik IAM dla narzedzi na laptopie kancelarii (Claude Code, AWS CLI).
  Uprawnienia ograniczone do wywolywania modeli Bedrock przez profile EU.
  Klucze dostepu NIE sa tworzone w tym szablonie (trafilyby do wyjsc stosu) -
  generuje je skrypt USTAW_DOSTEP_AWS.bat i od razu zapisuje w ~/.aws/credentials.

Parameters:
  NazwaUzytkownika:
    Type: String
    Default: pieczapp-claude
    Description: Nazwa uzytkownika IAM (prefiks pieczapp-)
    AllowedPattern: "^pieczapp-[a-z0-9-]+$"

Resources:
  PolitykaBedrockEU:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: pieczapp-bedrock-eu
      Description: Wywolywanie modeli Bedrock wylacznie przez profile eu. w regionach UE
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WywolanieModeliPrzezProfileEU
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub "arn:aws:bedrock:eu-central-1:${AWS::AccountId}:inference-profile/eu.*"
              - "arn:aws:bedrock:eu-central-1::foundation-model/*"
              - "arn:aws:bedrock:eu-west-1::foundation-model/*"
              - "arn:aws:bedrock:eu-west-3::foundation-model/*"
              - "arn:aws:bedrock:eu-north-1::foundation-model/*"
              - "arn:aws:bedrock:eu-south-1::foundation-model/*"
              - "arn:aws:bedrock:eu-south-2::foundation-model/*"
          - Sid: PrzegladanieModeli
            Effect: Allow
            Action:
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
          - Sid: WlasnaTozsamosc
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: "*"

  Uzytkownik:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref NazwaUzytkownika
      ManagedPolicyArns:
        - !Ref PolitykaBedrockEU
      Tags:
        - Key: projekt
          Value: pieczapp
        - Key: przeznaczenie
          Value: laptop-kancelarii

Outputs:
  UzytkownikArn:
    Value: !GetAtt Uzytkownik.Arn
  Polityka:
    Value: !Ref PolitykaBedrockEU
