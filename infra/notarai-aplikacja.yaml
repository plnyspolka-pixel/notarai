AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - aplikacja na ECS Fargate za load balancerem z HTTPS.
  Token administratora generowany w Secrets Manager (wartosc nigdy nie
  opuszcza AWS), rola zadania z polityka notarai-aplikacja (bucket spraw
  + Bedrock w UE). App Runner nie przyjmuje nowych klientow, stad ECS.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC aplikacji (na start domyslny VPC konta)
  Podsieci:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Publiczne podsieci w co najmniej dwoch strefach dostepnosci
  RepozytoriumUri:
    Type: String
    Description: Wynik RepozytoriumUri ze stosu notarai-budowanie
  TagObrazu:
    Type: String
    Description: Tag obrazu w ECR - skrot commita z 2-zbuduj-obraz.ps1
    AllowedPattern: "^[0-9a-f]{7,40}$"
  CertyfikatArn:
    Type: String
    Description: Wynik CertyfikatArn ze stosu notarai-certyfikat (status ISSUED)
  BucketSpraw:
    Type: String
    Default: notarai-sprawy
  Cpu:
    Type: String
    Default: "1024"
    AllowedValues: ["1024", "2048"]
  Pamiec:
    Type: String
    Default: "3072"
    Description: MiB. Dla 1024 CPU dozwolone 2048-8192, dla 2048 CPU 4096-16384.
  LiczbaKopii:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 6
    Description: >-
      Ile kontenerow ma dzialac naraz. 2 to minimum, zeby awaria jednego
      kontenera albo calej strefy dostepnosci nie przerwala pracy kancelarii.
  EmailAlarmowy:
    Type: String
    Default: ""
    Description: >-
      Adres, na ktory maja isc alarmy. Po wdrozeniu potwierdz subskrypcje
      linkiem z wiadomosci od AWS. Puste = alarmy bez powiadomien.
  LimitKosztowUsd:
    Type: Number
    Default: 150
    Description: Miesieczny budzet. Ostrzezenie przy 80 procentach i prognozie przekroczenia.
  Administratorzy:
    Type: String
    Default: plnyspolka@gmail.com
    Description: >-
      Stali administratorzy panelu /admin, adresy po przecinku. Konto zaklada
      sie samo przy pierwszym otwarciu panelu. Token z Secrets Manager zostaje
      tylko na awarie.
  PulaLogowania:
    Type: String
    Default: ""
    Description: Wynik PulaId ze stosu notarai-logowanie. Puste = logowanie wylaczone.
  KlientLogowania:
    Type: String
    Default: ""
    Description: Wynik KlientId ze stosu notarai-logowanie.
  StripeSekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/stripe (klucze klucz i webhook), zalozonego
      skryptem zapisz-sekret-stripe.ps1 - wartosci nie trafiaja do szablonu.
      Puste = platnosci wylaczone, nikogo nie blokujemy.
  ApifySekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/apify (klucz token), zalozonego skryptem
      zapisz-sekret-apify.ps1. Wlacza pobieranie tresci ksiag wieczystych
      z EKW przez dostawce (ekw.py). Puste = funkcja wylaczona.
  FinyouSekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/finyou (klucz token), zalozonego skryptem
      zapisz-sekret-finyou.ps1. Finance You jako dostawca tresci ksiag
      wieczystych (ekw.py) - ma pierwszenstwo przed Apify. Puste = wylaczone.
  FinyouAdres:
    Type: String
    Default: ""
    Description: Adres API Finance You (np. https://finyou.pl). Jawny, nie jest sekretem.
  StripeCena:
    Type: String
    Default: ""
    AllowedPattern: "^(price_[A-Za-z0-9]+)?$"
    Description: Identyfikator ceny abonamentu w Stripe (price_...). Jawny, nie jest sekretem.
  CenaAbonamentu:
    Type: String
    Default: ""
    AllowedPattern: "^([0-9]+(\\.[0-9]{1,2})?)?$"
    Description: Cena miesiaca abonamentu w zl do wyswietlenia (Fundacja zwolniona z VAT), np. 600.00.
  Rejestracja:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Czy notariusz moze sam zalozyc konto pod /rejestracja (z akceptacja
      Regulaminu i umowy powierzenia). false = konta zaklada tylko administrator.
  EmailNadawcy:
    Type: String
    Default: ""
    Description: >-
      Nadawca e-maili o zgloszeniach wizyt (np. "notarai <zapytania@notarai.pl>").
      Adres albo domena musi byc zweryfikowana w Amazon SES w tym regionie,
      a konto SES poza piaskownica. Pusto = bez wysylki (zgloszenia widac w aplikacji i panelu).
  EmailZgloszen:
    Type: String
    Default: ""
    Description: Adres obslugi notarai, na ktory idzie kopia kazdego zgloszenia wizyty (pusto = bez kopii).
  AdresPubliczny:
    Type: String
    Default: https://app.notarai.pl
    Description: Adres aplikacji - tu wraca platnik ze Stripe.

Conditions:
  MamyEmail: !Not [!Equals [!Ref EmailAlarmowy, ""]]
  MamyLogowanie: !Not [!Equals [!Ref PulaLogowania, ""]]
  MamyStripe: !Not [!Equals [!Ref StripeSekretArn, ""]]
  MamyApify: !Not [!Equals [!Ref ApifySekretArn, ""]]
  MamyFinyou: !Not [!Equals [!Ref FinyouSekretArn, ""]]
  MamyNadawce: !Not [!Equals [!Ref EmailNadawcy, ""]]

Resources:
  # ---------------- sekret ----------------
  # Token panelu admina. Generuje go AWS; odczytasz go w konsoli Secrets
  # Manager (notarai/admin-token -> Retrieve secret value).
  SekretAdmina:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: notarai/admin-token
      Description: notarai - token panelu administratora /api/admin
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - Key: projekt
          Value: notarai

  # ---------------- logi ----------------
  # Aplikacja nie loguje danych osobowych (patrz testy *_nie_trafia_do_logow).
  LogiAplikacji:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/notarai
      RetentionInDays: 90

  # ---------------- role ----------------
  # Rola wykonawcza: agent ECS pobiera obraz, pisze logi, czyta sekret.
  RolaWykonawcza:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-ecs-wykonawcza
      Description: notarai - agent ECS pobiera obraz, pisze logi i wstrzykuje token admina
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: sekret-admina
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SekretAdmina
        - !If
          - MamyStripe
          - PolicyName: sekret-stripe
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref StripeSekretArn
          - !Ref AWS::NoValue
        - !If
          - MamyApify
          - PolicyName: sekret-apify
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ApifySekretArn
          - !Ref AWS::NoValue
        - !If
          - MamyFinyou
          - PolicyName: sekret-finyou
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref FinyouSekretArn
          - !Ref AWS::NoValue

  # Rola zadania: kod aplikacji. Tylko bucket spraw i Bedrock w UE.
  RolaZadania:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-ecs-zadanie
      Description: notarai - kod aplikacji czyta i zapisuje sprawy oraz wywoluje Bedrock
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:aws:iam::${AWS::AccountId}:policy/notarai-aplikacja"
      Policies:
        # Zakladanie kont uzytkownikow (panel admina). Logowanie, odzyskiwanie
        # hasla i sprawdzanie tokenu nie wymagaja uprawnien IAM.
        - !If
          - MamyLogowanie
          - PolicyName: zakladanie-kont
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  # Zakladanie i ponawianie zaproszen (AdminCreateUser) oraz
                  # usuwanie osob z zespolu przez wlasciciela kancelarii.
                  Action:
                    - cognito-idp:AdminCreateUser
                    - cognito-idp:AdminDeleteUser
                  Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${PulaLogowania}"
          - !Ref AWS::NoValue

        # E-maile o zgloszeniach wizyt (wizyty.py) przez SES - tylko z tozsamosci tego konta.
        - !If
          - MamyNadawce
          - PolicyName: wysylka-email
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - ses:SendEmail
                  Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
          - !Ref AWS::NoValue

  # ---------------- siec ----------------
  GrupaLoadBalancera:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: notarai-alb
      GroupDescription: notarai - ruch z internetu do load balancera, HTTP i HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP - tylko przekierowanie na HTTPS
      Tags:
        - Key: projekt
          Value: notarai

  # Kontener przyjmuje ruch wylacznie z load balancera.
  GrupaZadania:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: notarai-zadanie
      GroupDescription: notarai - kontener aplikacji, ruch tylko z load balancera
      VpcId: !Ref VpcId
      Tags:
        - Key: projekt
          Value: notarai

  RegulaZadania:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GrupaZadania
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref GrupaLoadBalancera
      Description: Ruch z load balancera na port aplikacji

  # ---------------- load balancer ----------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: notarai
      Type: application
      Scheme: internet-facing
      Subnets: !Ref Podsieci
      SecurityGroups:
        - !Ref GrupaLoadBalancera
      LoadBalancerAttributes:
        # Odczyt skanow i generowanie projektu to jedno zadanie HTTP trwajace
        # do kilku minut (Bedrock: 300 s na probe, do 3 prob). Domyslne 60 s
        # zrywaloby polaczenie w polowie.
        - Key: idle_timeout.timeout_seconds
          Value: "900"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: projekt
          Value: notarai

  GrupaDocelowa:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: notarai
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      HealthCheckPath: /zdrowie
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Wdrozenie czeka, az stary kontener skonczy trwajace odczyty, zanim
        # go zatrzyma. Odczyt duzej sprawy trwa ok. 20 minut (z limitem
        # zapytan dluzej), a 300 s urwalo 24.10.2026 odczyt 51 stron w trakcie
        # wdrozenia ("network error"). 3600 s to maksimum ALB; bez trwajacych
        # odczytow podmiana nadal konczy sie od razu.
        - Key: deregistration_delay.timeout_seconds
          Value: "3600"
      Tags:
        - Key: projekt
          Value: notarai

  SluchaczHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref CertyfikatArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GrupaDocelowa

  SluchaczHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # ---------------- ECS ----------------
  Klaster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: notarai
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: projekt
          Value: notarai

  DefinicjaZadania:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: notarai
      Cpu: !Ref Cpu
      Memory: !Ref Pamiec
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt RolaWykonawcza.Arn
      TaskRoleArn: !GetAtt RolaZadania.Arn
      ContainerDefinitions:
        - Name: notarai
          Image: !Sub "${RepozytoriumUri}:${TagObrazu}"
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PIECZAPP_HOST
              Value: 0.0.0.0
            - Name: PIECZAPP_PORT
              Value: "8000"
            - Name: PIECZAPP_MAGAZYN
              Value: s3
            - Name: PIECZAPP_S3_BUCKET
              Value: !Ref BucketSpraw
            - Name: PIECZAPP_MULTI
              Value: "true"
            - Name: PIECZAPP_ADMINI
              Value: !Ref Administratorzy
            - Name: PIECZAPP_COGNITO_POOL
              Value: !Ref PulaLogowania
            - Name: PIECZAPP_COGNITO_KLIENT
              Value: !Ref KlientLogowania
            - Name: PIECZAPP_ABONAMENT_ZL
              Value: !Ref CenaAbonamentu
            - Name: PIECZAPP_ADRES
              Value: !Ref AdresPubliczny
            - Name: STRIPE_CENA
              Value: !Ref StripeCena
            - Name: PIECZAPP_REJESTRACJA
              Value: !Ref Rejestracja
            - Name: PIECZAPP_EMAIL_NADAWCA
              Value: !Ref EmailNadawcy
            - Name: PIECZAPP_EMAIL_ZGLOSZEN
              Value: !Ref EmailZgloszen
            - Name: PIECZAPP_PRZYPOMNIENIA
              Value: "true"
            - Name: PIECZAPP_FINYOU_URL
              Value: !Ref FinyouAdres
          Secrets:
            - Name: PIECZAPP_ADMIN_TOKEN
              ValueFrom: !Ref SekretAdmina
            # Klucze Stripe z sekretu JSON: <arn>:<klucz>:: (wersja biezaca).
            - !If
              - MamyStripe
              - Name: STRIPE_KLUCZ
                ValueFrom: !Sub "${StripeSekretArn}:klucz::"
              - !Ref AWS::NoValue
            - !If
              - MamyStripe
              - Name: STRIPE_WEBHOOK_SEKRET
                ValueFrom: !Sub "${StripeSekretArn}:webhook::"
              - !Ref AWS::NoValue
            # Token dostawcy EKW (ekw.py) z sekretu JSON notarai/apify.
            - !If
              - MamyApify
              - Name: PIECZAPP_APIFY_TOKEN
                ValueFrom: !Sub "${ApifySekretArn}:token::"
              - !Ref AWS::NoValue
            # Token partnerski Finance You (dostawca tresci KW) z sekretu notarai/finyou.
            - !If
              - MamyFinyou
              - Name: PIECZAPP_FINYOU_TOKEN
                ValueFrom: !Sub "${FinyouSekretArn}:token::"
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogiAplikacji
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: notarai
      Tags:
        - Key: projekt
          Value: notarai

  Usluga:
    Type: AWS::ECS::Service
    DependsOn:
      - SluchaczHttps
    Properties:
      ServiceName: notarai
      Cluster: !Ref Klaster
      TaskDefinition: !Ref DefinicjaZadania
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref LiczbaKopii
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Publiczna podsiec bez NAT: kontener potrzebuje wyjscia do ECR,
          # S3, Bedrock i Secrets Manager. Wejscie blokuje GrupaZadania.
          AssignPublicIp: ENABLED
          Subnets: !Ref Podsieci
          SecurityGroups:
            - !Ref GrupaZadania
      LoadBalancers:
        - ContainerName: notarai
          ContainerPort: 8000
          TargetGroupArn: !Ref GrupaDocelowa
      PropagateTags: SERVICE
      Tags:
        - Key: projekt
          Value: notarai

  # ---------------- czujniki ----------------
  # Aplikacja ma dzialac rok bez opieki, wiec awaria musi sie sama zglosic.
  Powiadomienia:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: notarai-alarmy
      DisplayName: notarai
      Tags:
        - Key: projekt
          Value: notarai

  SubskrypcjaEmail:
    Condition: MamyEmail
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Powiadomienia
      Protocol: email
      Endpoint: !Ref EmailAlarmowy

  # Brak zdrowego kontenera = kancelarie nie moga pracowac.
  AlarmBrakZdrowych:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-brak-zdrowych-kontenerow
      AlarmDescription: Load balancer nie ma ani jednego zdrowego kontenera
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt GrupaDocelowa.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # Brak danych tez jest zla wiadomoscia.
      TreatMissingData: breaching
      AlarmActions: [!Ref Powiadomienia]
      OKActions: [!Ref Powiadomienia]

  # Redundancja zjedzona: dziala mniej kopii, niz powinno.
  AlarmMniejKopii:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-mniej-kopii-niz-powinno
      AlarmDescription: Dziala mniej kontenerow niz zadano - zostala pojedyncza kopia
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt GrupaDocelowa.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref LiczbaKopii
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Bledy aplikacji: np. wycofany model Bedrock albo brak uprawnien.
  AlarmBledowAplikacji:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-bledy-aplikacji
      AlarmDescription: Aplikacja zwraca bledy 5xx
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Load balancer nie dostal odpowiedzi - kontener sie wywrocil albo zawiesil.
  AlarmBledowLoadBalancera:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-bledy-load-balancera
      AlarmDescription: Load balancer zwraca 5xx, czyli nie ma komu obsluzyc zadania
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Rachunek pilnuje sie sam - nieoplacone konto to przestoj calej uslugi.
  Budzet:
    Condition: MamyEmail
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: notarai-miesieczny
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref LimitKosztowUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailAlarmowy
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailAlarmowy

Outputs:
  TematAlarmow:
    Description: Temat SNS z alarmami
    Value: !Ref Powiadomienia
  AdresLoadBalancera:
    Description: Cel rekordu CNAME dla domeny aplikacji w az.pl
    Value: !GetAtt LoadBalancer.DNSName
  SekretAdminaArn:
    Description: Token panelu admina - odczyt w konsoli Secrets Manager
    Value: !Ref SekretAdmina
  Klaster:
    Value: !Ref Klaster
  Usluga:
    Value: !GetAtt Usluga.Name
