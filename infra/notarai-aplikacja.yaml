AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - aplikacja na ECS Fargate za load balancerem z HTTPS.
  Token administratora generowany w Secrets Manager (wartosc nigdy nie
  opuszcza AWS), rola zadania z polityka notarai-aplikacja (bucket spraw
  + Bedrock w UE). App Runner nie przyjmuje nowych klientow, stad ECS.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC aplikacji (na start domyslny VPC konta)
  Podsieci:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Publiczne podsieci w co najmniej dwoch strefach dostepnosci
  RepozytoriumUri:
    Type: String
    Description: Wynik RepozytoriumUri ze stosu notarai-budowanie
  TagObrazu:
    Type: String
    Description: Tag obrazu w ECR - skrot commita z 2-zbuduj-obraz.ps1
    AllowedPattern: "^[0-9a-f]{7,40}$"
  CertyfikatArn:
    Type: String
    Description: Wynik CertyfikatArn ze stosu notarai-certyfikat (status ISSUED)
  BucketSpraw:
    Type: String
    Default: notarai-sprawy
  Cpu:
    Type: String
    Default: "1024"
    AllowedValues: ["1024", "2048"]
  Pamiec:
    Type: String
    Default: "3072"
    Description: MiB. Dla 1024 CPU dozwolone 2048-8192, dla 2048 CPU 4096-16384.

Resources:
  # ---------------- sekret ----------------
  # Token panelu admina. Generuje go AWS; odczytasz go w konsoli Secrets
  # Manager (notarai/admin-token -> Retrieve secret value).
  SekretAdmina:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: notarai/admin-token
      Description: notarai - token panelu administratora /api/admin
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - Key: projekt
          Value: notarai

  # ---------------- logi ----------------
  # Aplikacja nie loguje danych osobowych (patrz testy *_nie_trafia_do_logow).
  LogiAplikacji:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/notarai
      RetentionInDays: 90

  # ---------------- role ----------------
  # Rola wykonawcza: agent ECS pobiera obraz, pisze logi, czyta sekret.
  RolaWykonawcza:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-ecs-wykonawcza
      Description: notarai - agent ECS pobiera obraz, pisze logi i wstrzykuje token admina
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: sekret-admina
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SekretAdmina

  # Rola zadania: kod aplikacji. Tylko bucket spraw i Bedrock w UE.
  RolaZadania:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-ecs-zadanie
      Description: notarai - kod aplikacji czyta i zapisuje sprawy oraz wywoluje Bedrock
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:aws:iam::${AWS::AccountId}:policy/notarai-aplikacja"

  # ---------------- siec ----------------
  GrupaLoadBalancera:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: notarai-alb
      GroupDescription: notarai - ruch z internetu do load balancera, HTTP i HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP - tylko przekierowanie na HTTPS
      Tags:
        - Key: projekt
          Value: notarai

  # Kontener przyjmuje ruch wylacznie z load balancera.
  GrupaZadania:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: notarai-zadanie
      GroupDescription: notarai - kontener aplikacji, ruch tylko z load balancera
      VpcId: !Ref VpcId
      Tags:
        - Key: projekt
          Value: notarai

  RegulaZadania:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GrupaZadania
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref GrupaLoadBalancera
      Description: Ruch z load balancera na port aplikacji

  # ---------------- load balancer ----------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: notarai
      Type: application
      Scheme: internet-facing
      Subnets: !Ref Podsieci
      SecurityGroups:
        - !Ref GrupaLoadBalancera
      LoadBalancerAttributes:
        # Odczyt skanow i generowanie projektu to jedno zadanie HTTP trwajace
        # do kilku minut (Bedrock: 300 s na probe, do 3 prob). Domyslne 60 s
        # zrywaloby polaczenie w polowie.
        - Key: idle_timeout.timeout_seconds
          Value: "900"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: projekt
          Value: notarai

  GrupaDocelowa:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: notarai
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      HealthCheckPath: /zdrowie
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Dluzsze niz typowe zadanie, zeby wdrozenie nie urywalo trwajacej
        # analizy skanow. Kosztem wolniejszej podmiany kontenera.
        - Key: deregistration_delay.timeout_seconds
          Value: "300"
      Tags:
        - Key: projekt
          Value: notarai

  SluchaczHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref CertyfikatArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GrupaDocelowa

  SluchaczHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # ---------------- ECS ----------------
  Klaster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: notarai
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: projekt
          Value: notarai

  DefinicjaZadania:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: notarai
      Cpu: !Ref Cpu
      Memory: !Ref Pamiec
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt RolaWykonawcza.Arn
      TaskRoleArn: !GetAtt RolaZadania.Arn
      ContainerDefinitions:
        - Name: notarai
          Image: !Sub "${RepozytoriumUri}:${TagObrazu}"
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PIECZAPP_HOST
              Value: 0.0.0.0
            - Name: PIECZAPP_PORT
              Value: "8000"
            - Name: PIECZAPP_MAGAZYN
              Value: s3
            - Name: PIECZAPP_S3_BUCKET
              Value: !Ref BucketSpraw
            - Name: PIECZAPP_MULTI
              Value: "true"
          Secrets:
            - Name: PIECZAPP_ADMIN_TOKEN
              ValueFrom: !Ref SekretAdmina
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogiAplikacji
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: notarai
      Tags:
        - Key: projekt
          Value: notarai

  Usluga:
    Type: AWS::ECS::Service
    DependsOn:
      - SluchaczHttps
    Properties:
      ServiceName: notarai
      Cluster: !Ref Klaster
      TaskDefinition: !Ref DefinicjaZadania
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Publiczna podsiec bez NAT: kontener potrzebuje wyjscia do ECR,
          # S3, Bedrock i Secrets Manager. Wejscie blokuje GrupaZadania.
          AssignPublicIp: ENABLED
          Subnets: !Ref Podsieci
          SecurityGroups:
            - !Ref GrupaZadania
      LoadBalancers:
        - ContainerName: notarai
          ContainerPort: 8000
          TargetGroupArn: !Ref GrupaDocelowa
      PropagateTags: SERVICE
      Tags:
        - Key: projekt
          Value: notarai

Outputs:
  AdresLoadBalancera:
    Description: Cel rekordu CNAME dla domeny aplikacji w az.pl
    Value: !GetAtt LoadBalancer.DNSName
  SekretAdminaArn:
    Description: Token panelu admina - odczyt w konsoli Secrets Manager
    Value: !Ref SekretAdmina
  Klaster:
    Value: !Ref Klaster
  Usluga:
    Value: !GetAtt Usluga.Name
