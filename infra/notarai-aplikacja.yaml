AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - aplikacja na ECS Fargate za load balancerem z HTTPS.
  Token administratora generowany w Secrets Manager (wartosc nigdy nie
  opuszcza AWS), rola zadania z polityka notarai-aplikacja (bucket spraw
  + Bedrock w UE). App Runner nie przyjmuje nowych klientow, stad ECS.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC aplikacji (na start domyslny VPC konta)
  Podsieci:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Publiczne podsieci w co najmniej dwoch strefach dostepnosci
  RepozytoriumUri:
    Type: String
    Description: Wynik RepozytoriumUri ze stosu notarai-budowanie
  TagObrazu:
    Type: String
    Description: >-
      Tag obrazu w ECR: skrot commita (2-zbuduj-obraz.ps1), skrot z doklejonymi poprawkami
      samonaprawy "<sha>-sn<skrot>" (straznik w wdrozenie.yml) albo "sn-<12 hex>" (potok
      samonaprawy w AWS, stos notarai-samonaprawa).
    AllowedPattern: "^([0-9a-f]{7,40}(-sn[0-9a-f]{6,12})?|sn-[0-9a-f]{12})$"
  CertyfikatArn:
    Type: String
    Description: Wynik CertyfikatArn ze stosu notarai-certyfikat (status ISSUED)
  AsystaOdczytu:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Pilotażowa asysta odczytu na żywo. Domyślnie wyłączona do weryfikacji
      Transcribe Streaming, RODO i zatwierdzania wersji w środowisku testowym.
  BucketSpraw:
    Type: String
    Default: notarai-sprawy
  # Rozmiar dobrany do pomiaru (23.11.2026, 14 dni): CPU srednio 0,2 %, szczyt
  # 31 % z 1 vCPU; pamiec szczyt 8 % z 3 GB (~250 MB). Model pracuje w Bedrock,
  # kontener glownie czeka na odpowiedz. Wiecej mocy = ten parametr w gore.
  Cpu:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
  Pamiec:
    Type: String
    Default: "2048"
    Description: MiB. Dla 512 CPU dozwolone 1024-4096, dla 1024 CPU 2048-8192, dla 2048 CPU 4096-16384.
  LiczbaKopii:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 6
    Description: >-
      Ile kontenerow ma dzialac naraz. 1 = najtaniej: po awarii ECS stawia
      nowy kontener w 1-2 minuty, wdrozenia ida bez przestoju (najpierw nowy,
      potem stary). 2 = brak przerwy takze przy awarii strefy, za podwojna cene.
  EmailAlarmowy:
    Type: String
    Default: ""
    Description: >-
      Adres, na ktory maja isc alarmy. Po wdrozeniu potwierdz subskrypcje
      linkiem z wiadomosci od AWS. Puste = alarmy bez powiadomien.
  LimitKosztowUsd:
    Type: Number
    Default: 150
    Description: Miesieczny budzet. Ostrzezenie przy 80 procentach i prognozie przekroczenia.
  BudzetBedrockUsd:
    Type: Number
    Default: 60
    Description: >-
      Miesieczny budzet samego Amazon Bedrock (modele Claude: skany, rozmowy, projekty,
      narzedzia kampanii). Osobny od calego rachunku, bo to jedyna pozycja, ktora rosnie
      z uzyciem. Ostrzezenie przy 80 procentach i prognozie przekroczenia.
  LimitTokenowBedrockDzien:
    Type: Number
    Default: 5000000
    Description: >-
      Dzienny limit tokenow Bedrock (wejscie + wyjscie, oba modele) dla alarmu
      notarai-bedrock-tokeny. 5 mln tokenow to ok. 25-60 USD dziennie na Opus 4.6;
      typowy dzien kancelarii to ulamek tego. Alarm nic nie blokuje, tylko powiadamia.
  ModelGlowny:
    Type: String
    Default: eu.anthropic.claude-opus-4-6-v1
    Description: Profil modelu, ktorym aplikacja czyta skany i pisze projekty (config.MODEL) - wymiar ModelId alarmu.
  ModelKalkulatora:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-6
    Description: Profil modelu publicznego kalkulatora taksy (tokenomia.MODEL_KALKULATORA) - wymiar ModelId alarmu.
  Administratorzy:
    Type: String
    Default: plnyspolka@gmail.com
    Description: >-
      Stali administratorzy panelu /admin, adresy po przecinku. Konto zaklada
      sie samo przy pierwszym otwarciu panelu. Token z Secrets Manager zostaje
      tylko na awarie.
  PulaLogowania:
    Type: String
    Default: ""
    Description: Wynik PulaId ze stosu notarai-logowanie. Puste = logowanie wylaczone.
  KlientLogowania:
    Type: String
    Default: ""
    Description: Wynik KlientId ze stosu notarai-logowanie.
  ApifySekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/apify (klucz token), zalozonego skryptem
      zapisz-sekret-apify.ps1. Wlacza pobieranie tresci ksiag wieczystych
      z EKW przez dostawce (ekw.py). Puste = funkcja wylaczona.
  FinyouSekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/finyou (klucz token), zalozonego skryptem
      zapisz-sekret-finyou.ps1. Finance You jako dostawca tresci ksiag
      wieczystych (ekw.py) - ma pierwszenstwo przed Apify. Puste = wylaczone.
  MetaSekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/meta (JSON z kluczami verify, app_secret,
      token). Wlacza webhook leadow z formularzy Meta /api/meta/leadgen
      (meta_leady.py). Puste = wylaczone.
  AgentGlosowySekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/agent-glosowy (klucz token), zalozonego skryptem
      zapisz-sekret-agenta-glosowego.ps1. Gdy jest, webhooki agenta glosowego
      ElevenLabs (/api/agent-glosowy, agent_glosowy.py) wymagaja naglowka
      X-Notarai-Agent. Puste = trasy otwarte jak publiczne formularze strony.
  OAuthPocztySekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/oauth-poczty (JSON: ms_klient, ms_sekret,
      google_klient, google_sekret), zalozonego skryptem
      zapisz-sekret-oauth-poczty.ps1. Wlacza przyciski "Zaloguj przez
      Microsoft" / "Zaloguj przez Google" przy podpinaniu skrzynki kancelarii
      (skrzynki.py). Puste = tylko logowanie haslem do IMAP.
  SamonaprawaSekretArn:
    Type: String
    Default: ""
    Description: >-
      Pelny ARN sekretu notarai/samonaprawa-github (klucz token), zalozonego
      skryptem zapisz-sekret-samonaprawy.ps1. Aplikacja NIE czyta juz tego sekretu
      (zgloszenia ida zdarzeniem EventBridge); czyta go potok samonaprawy w AWS
      (zapis poprawek w repozytorium, opcjonalny). Tu steruje tylko alarmem
      notarai-samonaprawa-bledy. Puste = bez alarmu.
  FinyouAdres:
    Type: String
    Default: ""
    Description: Adres API Finance You (np. https://finyou.pl). Jawny, nie jest sekretem.
  StawkaVat:
    Type: String
    Default: "0"
    AllowedValues: ["0", "0.23"]
    Description: >-
      VAT doliczany do ceny pakietu kredytow. 0 = Fundacja zwolniona
      podmiotowo (art. 113 ust. 1 ustawy o VAT); 0.23 po utracie zwolnienia.
  Tokenomia:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Kredyty sa jedynym sposobem zakupu (tokenomia.py, docs/tokenomia.md).
      false tylko awaryjnie = nikt nie placi, koszty liczone w logach.
  Rejestracja:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Czy notariusz moze sam zalozyc konto pod /rejestracja (z akceptacja
      Regulaminu i umowy powierzenia). false = konta zaklada tylko administrator.
  EmailNadawcy:
    Type: String
    Default: ""
    Description: >-
      Nadawca e-maili o zgloszeniach wizyt (np. "notarai <zapytania@notarai.pl>").
      Adres albo domena musi byc zweryfikowana w Amazon SES w tym regionie,
      a konto SES poza piaskownica. Pusto = bez wysylki (zgloszenia widac w aplikacji i panelu).
  EmailZgloszen:
    Type: String
    Default: ""
    Description: Adres obslugi notarai, na ktory idzie kopia kazdego zgloszenia wizyty (pusto = bez kopii).
  AdresPubliczny:
    Type: String
    Default: https://app.notarai.pl
    Description: Adres aplikacji - tu wraca platnik z TPay i tu Finance You sygnalizuje platnosc.

Conditions:
  MamyEmail: !Not [!Equals [!Ref EmailAlarmowy, ""]]
  MamyLogowanie: !Not [!Equals [!Ref PulaLogowania, ""]]
  MamyApify: !Not [!Equals [!Ref ApifySekretArn, ""]]
  MamyFinyou: !Not [!Equals [!Ref FinyouSekretArn, ""]]
  MamyMeta: !Not [!Equals [!Ref MetaSekretArn, ""]]
  MamyOAuthPoczty: !Not [!Equals [!Ref OAuthPocztySekretArn, ""]]
  MamyAgentaGlosowego: !Not [!Equals [!Ref AgentGlosowySekretArn, ""]]
  MamyNadawce: !Not [!Equals [!Ref EmailNadawcy, ""]]
  MamySamonaprawe: !Not [!Equals [!Ref SamonaprawaSekretArn, ""]]

Resources:
  # ---------------- sekret ----------------
  # Token panelu admina. Generuje go AWS; odczytasz go w konsoli Secrets
  # Manager (notarai/admin-token -> Retrieve secret value).
  SekretAdmina:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: notarai/admin-token
      Description: notarai - token panelu administratora /api/admin
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - Key: projekt
          Value: notarai

  # ---------------- logi ----------------
  # Aplikacja nie loguje danych osobowych (patrz testy *_nie_trafia_do_logow).
  LogiAplikacji:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/notarai
      RetentionInDays: 90

  # ---------------- role ----------------
  # Rola wykonawcza: agent ECS pobiera obraz, pisze logi, czyta sekret.
  RolaWykonawcza:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-ecs-wykonawcza
      Description: notarai - agent ECS pobiera obraz, pisze logi i wstrzykuje token admina
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: sekret-admina
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SekretAdmina
        - !If
          - MamyApify
          - PolicyName: sekret-apify
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ApifySekretArn
          - !Ref AWS::NoValue
        - !If
          - MamyFinyou
          - PolicyName: sekret-finyou
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref FinyouSekretArn
          - !Ref AWS::NoValue
        - !If
          - MamyMeta
          - PolicyName: sekret-meta
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref MetaSekretArn
          - !Ref AWS::NoValue
        - !If
          - MamyOAuthPoczty
          - PolicyName: sekret-oauth-poczty
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref OAuthPocztySekretArn
          - !Ref AWS::NoValue
        - !If
          - MamyAgentaGlosowego
          - PolicyName: sekret-agent-glosowy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref AgentGlosowySekretArn
          - !Ref AWS::NoValue

  # Rola zadania: kod aplikacji. Tylko bucket spraw i Bedrock w UE.
  RolaZadania:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-ecs-zadanie
      Description: notarai - kod aplikacji czyta i zapisuje sprawy oraz wywoluje Bedrock
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:aws:iam::${AWS::AccountId}:policy/notarai-aplikacja"
      Policies:
        # Polski lektor projektu — tylko Amazon Polly w regionie Frankfurt.
        # Ta polityka jest w stosie notarai-aplikacja, ktory wdraza OIDC CI/CD.
        - PolicyName: polly-lektor-eu
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PollyLektorEU
                Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: eu-central-1

        # ASR na zywo w Europie: tylko Amazon Transcribe Streaming we Frankfurcie.
        - PolicyName: transcribe-live-eu
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TranscribeLiveEU
                Effect: Allow
                Action:
                  - transcribe:StartStreamTranscription
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: eu-central-1

        # Zakladanie kont uzytkownikow (panel admina). Logowanie, odzyskiwanie
        # hasla i sprawdzanie tokenu nie wymagaja uprawnien IAM.
        - !If
          - MamyLogowanie
          - PolicyName: zakladanie-kont
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  # Zakladanie i ponawianie zaproszen (AdminCreateUser) oraz
                  # usuwanie osob z zespolu przez wlasciciela kancelarii.
                  Action:
                    - cognito-idp:AdminCreateUser
                    - cognito-idp:AdminDeleteUser
                  Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${PulaLogowania}"
          - !Ref AWS::NoValue

        # E-maile o zgloszeniach wizyt (wizyty.py) przez SES - tylko z tozsamosci tego konta.
        - !If
          - MamyNadawce
          - PolicyName: wysylka-email
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - ses:SendEmail
                  Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
          - !Ref AWS::NoValue

        # Polaczenie kancelarii z Poczta Polska (poczta_polska.py): login i haslo
        # do WebAPI Elektronicznego Nadawcy kazdej kancelarii w osobnym sekrecie
        # notarai-poczta-<kancelaria>. Kod nigdy nie zwraca hasla do przegladarki.
        # Postep samonaprawy (asystent kancelarii pokazuje notariuszowi, na jakim
        # etapie jest jego prosba). Zapisuje workflow samonaprawy, aplikacja tylko czyta.
        - PolicyName: postep-samonaprawy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/notarai/samonaprawa/*"

        # Zgloszenia bledow dla samonaprawy: zdarzenie na domyslna szyne EventBridge
        # (samonaprawa.py, docs/samonaprawa.md). Tylko PutEvents na szyne default.
        - PolicyName: zdarzenia-samonaprawy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"

        - PolicyName: sekrety-poczty-polskiej
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:notarai-poczta-*"

        # Skrzynka e-mail kancelarii (korespondencja.py): haslo IMAP kazdej
        # kancelarii w osobnym sekrecie notarai-skrzynka-<kancelaria>.
        # Kod nigdy nie zwraca hasla do przegladarki ani nie zapisuje go w S3.
        - PolicyName: sekrety-skrzynki-pocztowej
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:notarai-skrzynka-*"

        # Odrebne refresh tokeny Google Calendar; brak uprawnien do sekretow innych aplikacji.
        - PolicyName: sekrety-google-kalendarza
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:notarai-google-kalendarz-*"

  # ---------------- siec ----------------
  GrupaLoadBalancera:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: notarai-alb
      GroupDescription: notarai - ruch z internetu do load balancera, HTTP i HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP - tylko przekierowanie na HTTPS
      Tags:
        - Key: projekt
          Value: notarai

  # Kontener przyjmuje ruch wylacznie z load balancera.
  GrupaZadania:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: notarai-zadanie
      GroupDescription: notarai - kontener aplikacji, ruch tylko z load balancera
      VpcId: !Ref VpcId
      Tags:
        - Key: projekt
          Value: notarai

  RegulaZadania:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GrupaZadania
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref GrupaLoadBalancera
      Description: Ruch z load balancera na port aplikacji

  # ---------------- load balancer ----------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: notarai
      Type: application
      Scheme: internet-facing
      Subnets: !Ref Podsieci
      SecurityGroups:
        - !Ref GrupaLoadBalancera
      LoadBalancerAttributes:
        # Odczyt skanow i generowanie projektu to jedno zadanie HTTP trwajace
        # do kilku minut (Bedrock: 300 s na probe, do 3 prob). Domyslne 60 s
        # zrywaloby polaczenie w polowie.
        - Key: idle_timeout.timeout_seconds
          Value: "900"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        # Pomylkowe usuniecie stosu albo load balancera = przestoj wszystkich
        # kancelarii i zmiana adresu CNAME. Swiadome usuniecie wymaga
        # najpierw wylaczenia tej ochrony.
        - Key: deletion_protection.enabled
          Value: "true"
      Tags:
        - Key: projekt
          Value: notarai

  GrupaDocelowa:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: notarai
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      HealthCheckPath: /zdrowie
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Wdrozenie czeka, az stary kontener skonczy trwajace odczyty, zanim
        # go zatrzyma. Odczyt duzej sprawy trwa ok. 20 minut (z limitem
        # zapytan dluzej), a 300 s urwalo 24.10.2026 odczyt 51 stron w trakcie
        # wdrozenia ("network error"). 3600 s to maksimum ALB; bez trwajacych
        # odczytow podmiana nadal konczy sie od razu.
        - Key: deregistration_delay.timeout_seconds
          Value: "3600"
      Tags:
        - Key: projekt
          Value: notarai

  SluchaczHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref CertyfikatArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GrupaDocelowa

  SluchaczHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # ---------------- ECS ----------------
  Klaster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: notarai
      ClusterSettings:
        # Container Insights to ~40 platnych metryk CloudWatch. Alarmy stosu
        # patrza na metryki load balancera (darmowe), wiec go nie potrzebujemy.
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: projekt
          Value: notarai

  DefinicjaZadania:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: notarai
      Cpu: !Ref Cpu
      Memory: !Ref Pamiec
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt RolaWykonawcza.Arn
      TaskRoleArn: !GetAtt RolaZadania.Arn
      ContainerDefinitions:
        - Name: notarai
          Image: !Sub "${RepozytoriumUri}:${TagObrazu}"
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PIECZAPP_HOST
              Value: 0.0.0.0
            - Name: PIECZAPP_PORT
              Value: "8000"
            - Name: PIECZAPP_MAGAZYN
              Value: s3
            - Name: PIECZAPP_S3_BUCKET
              Value: !Ref BucketSpraw
            - Name: PIECZAPP_MULTI
              Value: "true"
            - Name: PIECZAPP_ADMINI
              Value: !Ref Administratorzy
            - Name: PIECZAPP_COGNITO_POOL
              Value: !Ref PulaLogowania
            - Name: PIECZAPP_COGNITO_KLIENT
              Value: !Ref KlientLogowania
            - Name: PIECZAPP_ADRES
              Value: !Ref AdresPubliczny
            - Name: PIECZAPP_VAT
              Value: !Ref StawkaVat
            - Name: PIECZAPP_REJESTRACJA
              Value: !Ref Rejestracja
            - Name: PIECZAPP_TOKENOMIA
              Value: !Ref Tokenomia
            - Name: PIECZAPP_EMAIL_NADAWCA
              Value: !Ref EmailNadawcy
            - Name: PIECZAPP_EMAIL_ZGLOSZEN
              Value: !Ref EmailZgloszen
            - Name: PIECZAPP_PRZYPOMNIENIA
              Value: "true"
            - Name: PIECZAPP_FINYOU_URL
              Value: !Ref FinyouAdres
            # Stenogramy aktow (stenogramy.py): na koncie dziala polityka Organizations
            # "notarai-bez-uczenia-ai" (AI services opt-out, wlaczona 23.11.2026), wiec
            # Transcribe nie zatrzymuje dzwieku do ulepszania modeli AWS.
            - Name: PIECZAPP_TRANSCRIBE_OPTOUT
              Value: "1"
            # Lektor projektu przez Amazon Polly we Frankfurcie.
            - Name: PIECZAPP_POLLY
              Value: "true"
            # Asysta odczytu: sesja uruchamiana recznie; opt-out Transcribe wymagany.
            - Name: PIECZAPP_ASYSTA_ODCZYTU
              Value: !Ref AsystaOdczytu
            # Wersja w zgloszeniach samonaprawy - po niej workflow widzi nawrot bledu.
            - Name: PIECZAPP_WERSJA
              Value: !Ref TagObrazu
            # Zgloszenia bledow trafiaja do potoku samonaprawy w AWS (bez GitHuba).
            - Name: PIECZAPP_SAMONAPRAWA_ZDARZENIA
              Value: "true"
          Secrets:
            - Name: PIECZAPP_ADMIN_TOKEN
              ValueFrom: !Ref SekretAdmina
            # Token dostawcy EKW (ekw.py) z sekretu JSON notarai/apify.
            - !If
              - MamyApify
              - Name: PIECZAPP_APIFY_TOKEN
                ValueFrom: !Sub "${ApifySekretArn}:token::"
              - !Ref AWS::NoValue
            # Token partnerski Finance You (dostawca tresci KW) z sekretu notarai/finyou.
            - !If
              - MamyFinyou
              - Name: PIECZAPP_FINYOU_TOKEN
                ValueFrom: !Sub "${FinyouSekretArn}:token::"
              - !Ref AWS::NoValue
            - !If
              - MamyMeta
              - Name: PIECZAPP_META_VERIFY
                ValueFrom: !Sub "${MetaSekretArn}:verify::"
              - !Ref AWS::NoValue
            - !If
              - MamyMeta
              - Name: PIECZAPP_META_APP_SECRET
                ValueFrom: !Sub "${MetaSekretArn}:app_secret::"
              - !Ref AWS::NoValue
            - !If
              - MamyMeta
              - Name: PIECZAPP_META_TOKEN
                ValueFrom: !Sub "${MetaSekretArn}:token::"
              - !Ref AWS::NoValue
            # Aplikacje OAuth (Microsoft Entra, Google) do podpinania skrzynek kancelarii.
            - !If
              - MamyOAuthPoczty
              - Name: PIECZAPP_OAUTH_MS_KLIENT
                ValueFrom: !Sub "${OAuthPocztySekretArn}:ms_klient::"
              - !Ref AWS::NoValue
            - !If
              - MamyOAuthPoczty
              - Name: PIECZAPP_OAUTH_MS_SEKRET
                ValueFrom: !Sub "${OAuthPocztySekretArn}:ms_sekret::"
              - !Ref AWS::NoValue
            - !If
              - MamyOAuthPoczty
              - Name: PIECZAPP_OAUTH_GOOGLE_KLIENT
                ValueFrom: !Sub "${OAuthPocztySekretArn}:google_klient::"
              - !Ref AWS::NoValue
            - !If
              - MamyOAuthPoczty
              - Name: PIECZAPP_OAUTH_GOOGLE_SEKRET
                ValueFrom: !Sub "${OAuthPocztySekretArn}:google_sekret::"
              - !Ref AWS::NoValue
            # Token webhookow agenta glosowego ElevenLabs (agent_glosowy.py).
            - !If
              - MamyAgentaGlosowego
              - Name: PIECZAPP_AGENT_GLOSOWY_TOKEN
                ValueFrom: !Sub "${AgentGlosowySekretArn}:token::"
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogiAplikacji
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: notarai
      Tags:
        - Key: projekt
          Value: notarai

  Usluga:
    Type: AWS::ECS::Service
    DependsOn:
      - SluchaczHttps
    Properties:
      ServiceName: notarai
      Cluster: !Ref Klaster
      TaskDefinition: !Ref DefinicjaZadania
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref LiczbaKopii
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Publiczna podsiec bez NAT: kontener potrzebuje wyjscia do ECR,
          # S3, Bedrock i Secrets Manager. Wejscie blokuje GrupaZadania.
          AssignPublicIp: ENABLED
          Subnets: !Ref Podsieci
          SecurityGroups:
            - !Ref GrupaZadania
      LoadBalancers:
        - ContainerName: notarai
          ContainerPort: 8000
          TargetGroupArn: !Ref GrupaDocelowa
      PropagateTags: SERVICE
      Tags:
        - Key: projekt
          Value: notarai

  # ---------------- czujniki ----------------
  # Aplikacja ma dzialac rok bez opieki, wiec awaria musi sie sama zglosic.
  Powiadomienia:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: notarai-alarmy
      DisplayName: notarai
      Tags:
        - Key: projekt
          Value: notarai

  SubskrypcjaEmail:
    Condition: MamyEmail
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Powiadomienia
      Protocol: email
      Endpoint: !Ref EmailAlarmowy

  # Samonaprawa: seria bledow kodu (nie chwilowych AWS) w 5 minut. Zapasowy
  # sygnal - zwykle wlasciciel dostaje wiadomosc z potoku samonaprawy, ale
  # gdyby zdarzenie nie dotarlo, ten alarm i tak przyjdzie mailem.
  FiltrSamonaprawy:
    Condition: MamySamonaprawe
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogiAplikacji
      # Znaczniki maja rodzaj "kod" albo "przejsciowy" - liczymy bez przejsciowych.
      FilterPattern: '"samonaprawa {" -przejsciowy'
      MetricTransformations:
        - MetricNamespace: notarai
          MetricName: SamonaprawaBledyKodu
          MetricValue: "1"
          DefaultValue: 0

  AlarmSamonaprawy:
    Condition: MamySamonaprawe
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-samonaprawa-bledy
      AlarmDescription: >-
        Co najmniej 5 bledow kodu w 5 minut (znaczniki samonaprawy w /ecs/notarai).
        Przebieg naprawy: tabela notarai-samonaprawa (DynamoDB), logi /aws/codebuild/notarai-samonaprawa.
      Namespace: notarai
      MetricName: SamonaprawaBledyKodu
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Brak zdrowego kontenera = kancelarie nie moga pracowac.
  AlarmBrakZdrowych:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-brak-zdrowych-kontenerow
      AlarmDescription: Load balancer nie ma ani jednego zdrowego kontenera
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt GrupaDocelowa.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # Brak danych tez jest zla wiadomoscia.
      TreatMissingData: breaching
      AlarmActions: [!Ref Powiadomienia]
      OKActions: [!Ref Powiadomienia]

  # Redundancja zjedzona: dziala mniej kopii, niz powinno.
  AlarmMniejKopii:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-mniej-kopii-niz-powinno
      AlarmDescription: Dziala mniej kontenerow niz zadano - zostala pojedyncza kopia
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt GrupaDocelowa.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref LiczbaKopii
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Bledy aplikacji: np. wycofany model Bedrock albo brak uprawnien.
  AlarmBledowAplikacji:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-bledy-aplikacji
      AlarmDescription: Aplikacja zwraca bledy 5xx
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Load balancer nie dostal odpowiedzi - kontener sie wywrocil albo zawiesil.
  AlarmBledowLoadBalancera:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-bledy-load-balancera
      AlarmDescription: Load balancer zwraca 5xx, czyli nie ma komu obsluzyc zadania
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Rachunek pilnuje sie sam - nieoplacone konto to przestoj calej uslugi.
  Budzet:
    Condition: MamyEmail
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: notarai-miesieczny
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref LimitKosztowUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailAlarmowy
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailAlarmowy

  # Bedrock to jedyna pozycja rachunku, ktora rosnie z uzyciem (tokeny). Osobny
  # budzet lapie petle ponowien, zbyt wysoki effort i nieoczekiwany ruch, zanim
  # zobaczy to budzet calego konta.
  BudzetBedrock:
    Condition: MamyEmail
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: notarai-bedrock-miesieczny
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudzetBedrockUsd
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailAlarmowy
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailAlarmowy

  # Spalanie tokenow dzien po dniu: suma wejscia i wyjscia obu modeli (metryki
  # AWS/Bedrock maja wymiar ModelId = identyfikator profilu "eu.").
  AlarmTokenowBedrock:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-bedrock-tokeny
      AlarmDescription: Dzienna suma tokenow Bedrock (wejscie + wyjscie) przekroczyla limit
      Metrics:
        - Id: we1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: InputTokenCount
              Dimensions:
                - Name: ModelId
                  Value: !Ref ModelGlowny
            Period: 86400
            Stat: Sum
        - Id: wy1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: OutputTokenCount
              Dimensions:
                - Name: ModelId
                  Value: !Ref ModelGlowny
            Period: 86400
            Stat: Sum
        - Id: we2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: InputTokenCount
              Dimensions:
                - Name: ModelId
                  Value: !Ref ModelKalkulatora
            Period: 86400
            Stat: Sum
        - Id: wy2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: OutputTokenCount
              Dimensions:
                - Name: ModelId
                  Value: !Ref ModelKalkulatora
            Period: 86400
            Stat: Sum
        - Id: razem
          Label: Tokeny Bedrock dziennie
          Expression: FILL(we1, 0) + FILL(wy1, 0) + FILL(we2, 0) + FILL(wy2, 0)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: !Ref LimitTokenowBedrockDzien
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

  # Dlawienie (ThrottlingException) - uzytkownicy widza "model przeciazony";
  # po kilku w 5 minut warto podniesc limit zapytan w Service Quotas.
  AlarmDlawieniaBedrock:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: notarai-bedrock-dlawienie
      AlarmDescription: Bedrock odrzuca zapytania z powodu limitu (InvocationThrottles)
      Namespace: AWS/Bedrock
      MetricName: InvocationThrottles
      Dimensions:
        - Name: ModelId
          Value: !Ref ModelGlowny
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Powiadomienia]

Outputs:
  TematAlarmow:
    Description: Temat SNS z alarmami
    Value: !Ref Powiadomienia
  AdresLoadBalancera:
    Description: Cel rekordu CNAME dla domeny aplikacji w az.pl
    Value: !GetAtt LoadBalancer.DNSName
  SekretAdminaArn:
    Description: Token panelu admina - odczyt w konsoli Secrets Manager
    Value: !Ref SekretAdmina
  Klaster:
    Value: !Ref Klaster
  Usluga:
    Value: !GetAtt Usluga.Name
