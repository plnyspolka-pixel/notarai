AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai-gpu-komfy: jednorazowe stanowisko GPU (spot) do ujec bez mowy i klatek serialu
  Komputerku - ComfyUI + Wan 2.2 I2V 14B fp8 + LoRA 4-krokowa. Bez nowych kont: ten sam
  rachunek AWS co aplikacja. Instancja spot (persistent, przerwanie = stop), dysk z modelami
  zostaje, dostep przez SSM Session Manager (bez SSH), port 8188 tylko z podanego CIDR,
  automatyczne wylaczenie po TtlMinutes. NIEPRZETESTOWANE - pierwszy deploy z malym TTL.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Podsiec publiczna (ComfyUI pobiera modele z Hugging Face).
  AllowedCidr:
    Type: String
    Description: Skad wolno wejsc na port 8188 (np. adres IP montazysty /32).
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$'
  InstanceType:
    Type: String
    Default: g6.xlarge
    AllowedValues: [g6.xlarge, g6.2xlarge, g5.xlarge, g5.2xlarge, g6e.xlarge]
    Description: g6.xlarge = L4 24 GB (spot ok. 0,3 USD/h we Frankfurcie); g6e.xlarge = L40S 48 GB.
  MaxSpotPriceUsd:
    Type: String
    Default: "0.60"
  TtlMinutes:
    Type: Number
    Default: 180
    MinValue: 30
    MaxValue: 720
    Description: Po tym czasie instancja sama sie zatrzymuje (shutdown -h); dysk zostaje.
  ModelsVolumeGb:
    Type: Number
    Default: 200
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id
    Description: Deep Learning Base AMI (sterownik NVIDIA). Sprawdz nazwe parametru SSM w regionie.
Resources:
  Rola:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-gpu-komfy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  ProfilInstancji:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: notarai-gpu-komfy
      Roles: [!Ref Rola]
  GrupaBezpieczenstwa:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: notarai-gpu-komfy
      GroupDescription: ComfyUI 8188 tylko z AllowedCidr; reszta przez SSM
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8188
          ToPort: 8188
          CidrIp: !Ref AllowedCidr
  Instancja:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref ProfilInstancji
      SecurityGroupIds: [!Ref GrupaBezpieczenstwa]
      InstanceMarketOptions:
        MarketType: spot
        SpotOptions:
          MaxPrice: !Ref MaxSpotPriceUsd
          SpotInstanceType: persistent
          InstanceInterruptionBehavior: stop
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 60, VolumeType: gp3, DeleteOnTermination: true}
        - DeviceName: /dev/sdf
          Ebs: {VolumeSize: !Ref ModelsVolumeGb, VolumeType: gp3, DeleteOnTermination: false}
      Tags:
        - {Key: Name, Value: notarai-gpu-komfy}
        - {Key: projekt, Value: komputerku}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          # dysk z modelami: pierwszy raz formatujemy, potem tylko montujemy
          DEV=$(lsblk -dpno NAME | grep -v nvme0n1 | head -1)
          blkid "$DEV" || mkfs.ext4 -L modele "$DEV"
          mkdir -p /workspace && mount "$DEV" /workspace
          # ten sam skrypt co na RunPod (docs/kampania-komputerku/narzedzia/gpu/runpod_4090.sh),
          # pobrany z master; WORKSPACE=/workspace
          curl -fsSL https://raw.githubusercontent.com/plnyspolka-pixel/notarai/master/docs/kampania-komputerku/narzedzia/gpu/runpod_4090.sh -o /workspace/komfy.sh
          WORKSPACE=/workspace bash /workspace/komfy.sh
          nohup env WORKSPACE=/workspace bash /workspace/komfy.sh start > /workspace/comfy.log 2>&1 &
          # automatyczne wylaczenie: stop instancji spot persistent = koniec naliczania
          shutdown -h +${TtlMinutes}
Outputs:
  InstanceId:
    Value: !Ref Instancja
  ComfyUrl:
    Value: !Sub "http://${Instancja.PublicIp}:8188"
  Uwaga:
    Value: >-
      Po paczce klipow: aws ec2 stop-instances (dysk z modelami zostaje). Zadanie spot persistent
      wznawia instancje po przerwaniu - zeby zakonczyc na stale, usun stos.
