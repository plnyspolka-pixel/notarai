AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - DAWNE repozytorium kodu w koncie AWS (CodeCommit, eu-central-1)
  i dostep do niego dla tozsamosci, ktora wypychala zmiany ze stanowiska.

  NIEAKTUALNE od 07.11.2026: cala historia zostala przeniesiona do GitHub
  (https://github.com/plnyspolka-pixel/notarai), tam jest teraz jedyne zrodlo
  prawdy. Repozytorium CodeCommit zostaje na razie jako zamrozona kopia (nie
  wypychaj do niego zmian). Gdy nic juz go nie potrzebuje, stos mozna usunac:
  Repozytorium ma DeletionPolicy Retain, wiec usuniecie stosu zdejmie tylko
  polityke IAM, a samo repozytorium trzeba skasowac osobno w konsoli.

  Uwaga: AWS zamknal CodeCommit dla nowych klientow. To konto ma dostep, ale
  usluga nie dostaje nowych funkcji - przy dluzszej perspektywie warto miec
  plan przeniesienia historii gdzie indziej.

Parameters:
  NazwaRepozytorium:
    Type: String
    Default: notarai
  UzytkownikGit:
    Type: String
    Default: pieczapp-app
    Description: >-
      Istniejacy uzytkownik IAM, ktory dostanie prawo czytania i wypychania
      zmian. Swiadomie ten sam, ktory ma juz klucze na stanowisku - nie
      mnozymy trwalych kluczy. Uprawnienia sa zawezone do tego repozytorium.

Resources:
  Repozytorium:
    Type: AWS::CodeCommit::Repository
    # Historia kodu nie moze zniknac razem ze stosem.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref NazwaRepozytorium
      RepositoryDescription: notarai - kod aplikacji kancelarii notarialnej
      Tags:
        - Key: projekt
          Value: notarai

  DostepDoRepozytorium:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: notarai-repozytorium
      Description: notarai - czytanie i wypychanie zmian do repozytorium kodu
      Users:
        - !Ref UzytkownikGit
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PracaNaRepozytorium
            Effect: Allow
            Action:
              - codecommit:GitPull
              - codecommit:GitPush
              - codecommit:GetRepository
              - codecommit:GetBranch
              - codecommit:ListBranches
              - codecommit:GetCommit
              - codecommit:GetDifferences
              - codecommit:BatchGetCommits
            Resource: !GetAtt Repozytorium.Arn
          # Lista repozytoriow nie dotyczy pojedynczego zasobu.
          - Sid: ListaRepozytoriow
            Effect: Allow
            Action: codecommit:ListRepositories
            Resource: "*"

Outputs:
  AdresGit:
    Description: >-
      Zdalne repozytorium dla polecenia git (wymaga pakietu
      git-remote-codecommit i profilu AWS o tej nazwie)
    Value: !Sub "codecommit::${AWS::Region}://pieczapp@${NazwaRepozytorium}"
  AdresHttps:
    Description: Adres HTTPS repozytorium
    Value: !GetAtt Repozytorium.CloneUrlHttp
