AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NotarAI pilot only - one preview-only Nitro ECS worker per minute if work is
  pending. Dispatcher is disabled by default. No production service changes.
Parameters:
  TenantId:
    Type: String
    Default: pilot01
    AllowedPattern: "^[a-z0-9]{1,12}$"
  DispatchEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Explicit operator opt-in after Nitro hardware validation
  CodeBucket:
    Type: String
    Description: Operator-controlled artifact bucket in eu-central-1
  CodeKey:
    Type: String
    Description: Immutable versioned zip bundle for confidential scheduler
  TaskDefinitionArn:
    Type: String
    Description: Pinned staging ECS Managed Instances task definition ARN
  TaskRoleArn:
    Type: String
    Description: Exact Nitro guest IAM role ARN (no wildcard pass-role)
  TaskExecutionRoleArn:
    Type: String
    Description: Exact Nitro guest execution role ARN
  WorkQueueArn:
    Type: String
    Description: Dedicated preexisting SQS FIFO queue ARN (guest reads this)
  WorkQueueUrl:
    Type: String
    Description: Matching preexisting SQS FIFO queue URL
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Dedicated private subnet without public IP allocation
  GuestSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Pilot Nitro task security group - egress to be tightened
Conditions:
  EnableScheduler: !Equals [!Ref DispatchEnabled, "true"]
Resources:
  DispatchLeaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "notarai-confidential-dispatch-${TenantId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Purpose
          Value: NotarAI-synthetic-Nitro-pilot
  DispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "notarai-confidential-dispatch-${TenantId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: "notarai-confidential-dispatch-minimum"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ObserveWorkQueue
                Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: !Ref WorkQueueArn
              - Sid: AtomicallyReserveOneWorker
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DispatchLeaseTable.Arn
              - Sid: ListOnlyPilotTasks
                Effect: Allow
                Action: ecs:ListTasks
                Resource: !Sub "arn:aws:ecs:eu-central-1:${AWS::AccountId}:cluster/notarai-confidential-${TenantId}"
              - Sid: ValidateEcsRuntime
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeCapacityProviders
                  - ecs:DescribeTasks
                Resource: "*"
              - Sid: StartOnlyPinnedTask
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref TaskDefinitionArn
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub "arn:aws:ecs:eu-central-1:${AWS::AccountId}:cluster/notarai-confidential-${TenantId}"
              - Sid: PassOnlyGuestTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref TaskRoleArn
                  - !Ref TaskExecutionRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
  DispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "notarai-confidential-dispatch-${TenantId}"
      Description: Only synthetic preview pilot tasks. No plaintext access.
      Runtime: python3.12
      Handler: confidential.dispatch_lambda.handler
      Role: !GetAtt DispatcherRole.Arn
      MemorySize: 192
      Timeout: 50
      ReservedConcurrentExecutions: 1
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          NOTARAI_DISPATCH_ENABLED: !Ref DispatchEnabled
          NOTARAI_ACCOUNT: !Ref AWS::AccountId
          NOTARAI_TENANT: !Ref TenantId
          NOTARAI_CLUSTER: !Sub "notarai-confidential-${TenantId}"
          NOTARAI_CAPACITY_PROVIDER: !Sub "notarai-confidential-${TenantId}"
          NOTARAI_TASK_DEFINITION_ARN: !Ref TaskDefinitionArn
          NOTARAI_WORK_QUEUE_URL: !Ref WorkQueueUrl
          NOTARAI_PRIVATE_SUBNET: !Ref PrivateSubnetId
          NOTARAI_INSTANCE_SECURITY_GROUP: !Ref GuestSecurityGroupId
          NOTARAI_LEASE_TABLE: !Ref DispatchLeaseTable
      Tags:
        - Key: Purpose
          Value: NotarAI-synthetic-Nitro-pilot
  DispatcherSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "notarai-confidential-dispatch-${TenantId}"
      Description: One worker at a time, only while synthetic SQS previews wait
      ScheduleExpression: "rate(1 minute)"
      State: !If [EnableScheduler, ENABLED, DISABLED]
      Targets:
        - Id: ConfidentialDispatcher
          Arn: !GetAtt DispatcherFunction.Arn
          Input: '{"source":"notarai.confidential.tick"}'
  AllowEventBridgeDispatcher:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DispatcherFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DispatcherSchedule.Arn
Outputs:
  DispatchFunctionArn:
    Value: !GetAtt DispatcherFunction.Arn
  DispatchLeaseTable:
    Value: !Ref DispatchLeaseTable
  DispatcherScheduleRule:
    Value: !Ref DispatcherSchedule
