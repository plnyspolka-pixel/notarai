AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - separate Nitro confidential task definition and restricted KMS task role.
  NOT launched by this stack. No production data, network or cluster changes.
Parameters:
  ContainerImage:
    Type: String
    Description: Immutable ECR image URI with sha256 digest, containing audited guest worker
    AllowedPattern: "^.+@sha256:[a-f0-9]{64}$"
  TaskExecutionRoleArn:
    Type: String
    Description: Existing dedicated ECS execution role (ECR image pull only)
  AttestationPolicyBase64:
    Type: String
    Description: Envelope generated by ecs-nitro-sandbox-genpolicy from the final task definition
    MinLength: 16
  ExpectedPCR17:
    Type: String
    Description: Exact PCR17 from ecs-nitro-sandbox-genpolicy --output pcrs
    AllowedPattern: "^[0-9a-fA-F]{96}$"
  ConfidentialKmsKeyArn:
    Type: String
    Description: Customer-approved RSA ENCRYPT_DECRYPT KMS key with external attestation-gated key policy
    AllowedPattern: "^arn:aws:kms:eu-[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$"
Resources:
  ConfidentialTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-confidential-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: notarai-attested-kms-decrypt
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DecryptOnlyFromAttestedNitroTask
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref ConfidentialKmsKeyArn
                Condition:
                  StringEqualsIgnoreCase:
                    kms:RecipientAttestation:PCR17: !Ref ExpectedPCR17
                    kms:RecipientAttestation:PCR8:ServiceName: ecs.amazonaws.com
  ConfidentialTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: notarai-confidential-browser
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "4096"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !GetAtt ConfidentialTaskRole.Arn
      TrustedExecutionConfiguration:
        IsolationMode: CONFIDENTIAL_SANDBOX
        AttestationPolicy: !Ref AttestationPolicyBase64
      ContainerDefinitions:
        - Name: confidential-browser
          Image: !Ref ContainerImage
          Essential: true
          Cpu: 2048
          Memory: 4096
          ReadonlyRootFilesystem: true
          Environment:
            - Name: NOTARAI_CONFIDENTIAL_REQUIRED
              Value: "1"
            - Name: AWS_REGION
              Value: eu-central-1
          LinuxParameters:
            InitProcessEnabled: true
          # No CloudWatch application logs here until a strictly metadata-only
          # logger has been reviewed for zero plaintext / PII leakage.
          # Guest code MUST use a writable sandbox-local tmpfs for Chromium.
          MountPoints: []
Outputs:
  TaskDefinitionArn:
    Value: !Ref ConfidentialTaskDefinition
  TaskRoleArn:
    Value: !GetAtt ConfidentialTaskRole.Arn
