AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NotarAI customer-owned v3 ECS Nitro preview task (KMS-free release).
  Requires independent customer grant and image-pinned origin key.
  Does not create capacity provider, cluster or running service.
Parameters:
  ContainerImage:
    Type: String
    Description: Immutable ECR image URI pinned to an audited digest
    AllowedPattern: "^.+@sha256:[a-f0-9]{64}$"
  AttestationPolicyBase64:
    Type: String
    Description: Policy generated for the final image by ecs-nitro-sandbox-genpolicy
    MinLength: 16
  TenantId:
    Type: String
    AllowedPattern: "^[a-z0-9]{1,12}$"
    Description: One test tenant, never mix kancelarie
  EncryptedBucketName:
    Type: String
    Description: Existing ciphertext-only bucket. Bucket policy must permit this task role.
  JobQueueArn:
    Type: String
    Description: Dedicated SQS queue ARN with metadata-only messages
  JobQueueUrl:
    Type: String
    Description: Dedicated SQS queue URL within EU AWS region
Resources:
  ConfidentialTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "notarai-confidential-execution-${TenantId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  ConfidentialTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "notarai-confidential-${TenantId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: notarai-confidential-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyOwnCiphertexts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${EncryptedBucketName}/kancelarie/${TenantId}/confidential/*"
              - Sid: ReadCustomerChallengeAndEncryptedGrant
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${EncryptedBucketName}/kancelarie/${TenantId}/confidential-control/*/challenge.json"
                  - !Sub "arn:aws:s3:::${EncryptedBucketName}/kancelarie/${TenantId}/confidential-control/*/grant.json"
              - Sid: PublishAttestationOnly
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${EncryptedBucketName}/kancelarie/${TenantId}/confidential-control/*/attestation.cbor"
              - Sid: ReadWriteTenantOneShotLedger
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/notarai-confidential-jobs-${TenantId}"
              - Sid: WriteMetadataOnlyResults
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${EncryptedBucketName}/kancelarie/${TenantId}/confidential-results/*"
              - Sid: ConsumeOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !Ref JobQueueArn
  ConfidentialTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "notarai-confidential-${TenantId}"
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt ConfidentialTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ConfidentialTaskRole.Arn
      TrustedExecutionConfiguration:
        IsolationMode: CONFIDENTIAL_SANDBOX
        AttestationPolicy: !Ref AttestationPolicyBase64
      ContainerDefinitions:
        - Name: confidential-browser
          Image: !Ref ContainerImage
          Essential: true
          Command: ["python", "-m", "confidential.customer_v3_worker"]
          Cpu: 2048
          Memory: 4096
          User: "10001:10001"
          ReadonlyRootFilesystem: true
          Environment:
            - Name: NOTARAI_CONFIDENTIAL_REQUIRED
              Value: "1"
            - Name: NOTARAI_CONFIDENTIAL_TENANT
              Value: !Ref TenantId
            - Name: NOTARAI_CONFIDENTIAL_BUCKET
              Value: !Ref EncryptedBucketName
            - Name: NOTARAI_CONFIDENTIAL_QUEUE_URL
              Value: !Ref JobQueueUrl
            - Name: NOTARAI_3ZERO_MODE
              Value: customer-v3
            - Name: AWS_ACCOUNT_ID
              Value: !Ref AWS::AccountId
            - Name: AWS_REGION
              Value: eu-central-1
            - Name: HOME
              Value: /tmp
            - Name: XDG_CACHE_HOME
              Value: /tmp
            - Name: TMPDIR
              Value: /tmp
          LinuxParameters:
            InitProcessEnabled: true
            SharedMemorySize: 256
            Tmpfs:
              - ContainerPath: /tmp
                Size: 512
                MountOptions: [rw, nosuid, nodev]
          # No shared volumes, no stdout of plaintext, no log driver.
Outputs:
  TaskDefinitionArn:
    Value: !Ref ConfidentialTaskDefinition
  TaskRoleArn:
    Value: !GetAtt ConfidentialTaskRole.Arn
