AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NotarAI synthetic approval replay ledger only. NO consumer IAM grants and
  NO production enablement. Public signer registry is provisioned separately.
Parameters:
  TenantId:
    Type: String
    AllowedPattern: "^[a-z0-9]{1,12}$"
    Default: pilot01
Resources:
  ApprovalLedger:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "notarai-confidential-approvals-${TenantId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Purpose
          Value: NotarAI-confidential-synthetic-approval
  CredentialRegistry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "notarai-confidential-credentials-${TenantId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Purpose
          Value: NotarAI-approved-notary-credentials
Outputs:
  CredentialRegistryName:
    Value: !Ref CredentialRegistry
  CredentialRegistryArn:
    Value: !GetAtt CredentialRegistry.Arn
  ApprovalLedgerName:
    Value: !Ref ApprovalLedger
  ApprovalLedgerArn:
    Value: !GetAtt ApprovalLedger.Arn
