AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - bucket S3 na sprawy kancelarii (tryb SaaS, PIECZAPP_MAGAZYN=s3)
  oraz polityka IAM dla roli aplikacji (App Runner / ECS). Region: eu-central-1.
  Bucket przechowuje dane osobowe klientow kancelarii - utworzenie stosu wymaga
  swiadomej decyzji (patrz CLAUDE.md).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  NazwaBucketa:
    Type: String
    Default: notarai-sprawy
    Description: Nazwa bucketa (globalnie unikalna, tylko male litery, cyfry i myslniki)
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
  KluczKms:
    Type: String
    Default: ""
    Description: >-
      Opcjonalny ARN zewnetrznego klucza KMS. Pusty (zalecane) = stos tworzy
      wlasny klucz notarai-sprawy (KluczSpraw). Aplikacja szyfruje kluczem
      z PIECZAPP_KMS_KEY_ID (alias/notarai-sprawy).
  RolaAplikacji:
    Type: String
    Default: notarai-ecs-zadanie
    Description: Nazwa roli zadania ECS (stos notarai-aplikacja) - jedynej, ktora czyta sprawy.
  RolaKopii:
    Type: String
    Default: notarai-kopia
    Description: Nazwa roli AWS Backup (stos notarai-kopia) - kopiuje i odtwarza sprawy.
  EmailZabezpieczen:
    Type: String
    Default: ""
    Description: >-
      Adres na powiadomienie o zmianie lub usunieciu polityki bucketa. Pusty =
      bez powiadomienia (zmiana i tak zostaje w CloudTrail).

Conditions:
  WlasnyKlucz: !Equals [!Ref KluczKms, ""]
  MamyEmail: !Not [!Equals [!Ref EmailZabezpieczen, ""]]

Resources:
  # Klucz szyfrujacy sprawy wszystkich kancelarii (decyzja wlasciciela 23.11.2026:
  # wszystkie sprawy w chmurze, szyfrowane kluczem notarai zamiast klucza S3).
  # - zostaje we Frankfurcie (klucz jednoregionowy), rotacja co rok,
  # - odszyfrowac moze tylko rola aplikacji i rola kopii zapasowej - nawet
  #   administrator konta nie przeczyta spraw (jak w polityce bucketa nizej),
  # - kazde uzycie klucza jest w CloudTrail,
  # - wylaczenie klucza odcina dostep do spraw natychmiast.
  # Utrata klucza = utrata spraw, dlatego Retain i 30 dni na odwolanie usuniecia.
  KluczSpraw:
    Type: AWS::KMS::Key
    Condition: WlasnyKlucz
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: notarai - szyfrowanie spraw kancelarii w buckecie S3
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Zarzadzanie kluczem przez IAM konta (bez tego klucza nie daloby sie
          # w ogole administrowac). Odszyfrowanie i tak ogranicza zakaz nizej.
          - Sid: KontoZarzadzaKluczem
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: OdszyfrowanieTylkoAplikacjaIKopia
            Effect: Deny
            Principal: "*"
            Action:
              - kms:Decrypt
              - kms:ReEncryptFrom
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaAplikacji}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaKopii}"
              Bool:
                aws:PrincipalIsAWSService: "false"
      Tags:
        - Key: projekt
          Value: notarai
        - Key: dane-osobowe
          Value: "tak"

  AliasKluczaSpraw:
    Type: AWS::KMS::Alias
    Condition: WlasnyKlucz
    Properties:
      AliasName: alias/notarai-sprawy
      TargetKeyId: !Ref KluczSpraw

  BucketSprawy:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref NazwaBucketa
      # Dane kancelarii NIGDY nie moga byc publiczne.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Kazdy obiekt szyfrowany; wersjonowanie pozwala cofnac nadpisanie.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          # Klucz bucketa (BucketKey) ogranicza wywolania KMS - i koszt - o rzedy wielkosci.
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !If [WlasnyKlucz, !GetAtt KluczSpraw.Arn, !Ref KluczKms]
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: sprzatanie-starych-wersji
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: porzucone-uploady
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: teczki-klientow-30-dni
            Status: Enabled
            Prefix: kancelarie/_administracja/teczki/
            ExpirationInDays: 31
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      Tags:
        - Key: projekt
          Value: notarai
        - Key: dane-osobowe
          Value: "tak"

  # Wymuszenie TLS - zadnego dostepu po zwyklym HTTP. Tresc spraw czyta
  # wylacznie aplikacja i kopia zapasowa: zakaz obejmuje kazdego innego,
  # takze administratorow konta i uzytkownika root (umowa powierzenia § 5
  # ust. 3 i 6). Zdjecie zakazu wymaga zmiany tej polityki, a to zostaje
  # w CloudTrail i wysyla powiadomienie (RegulaZmianyPolityki).
  PolitykaBucketa:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketSprawy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TylkoTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BucketSprawy.Arn
              - !Sub "${BucketSprawy.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: TrescSprawTylkoDlaAplikacji
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectVersionForReplication
              - s3:GetObjectTorrent
              - s3:PutObject
              - s3:GetObjectAttributes
            Resource: !Sub "${BucketSprawy.Arn}/kancelarie/*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaAplikacji}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaKopii}"
          # Zaden plik nie trafi do bucketa zaszyfrowany slabszym kluczem S3 -
          # tylko klucz KMS notarai (domyslny bucketa albo wskazany jawnie).
          - Sid: TylkoKluczNotarai
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${BucketSprawy.Arn}/*"
            Condition:
              StringEquals:
                s3:x-amz-server-side-encryption: AES256
          # Nazwy plikow to tez dane: skany nazywaja sie nazwiskami stron.
          - Sid: SpisPlikowTylkoDlaAplikacji
            Effect: Deny
            Principal: "*"
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:ListBucketMultipartUploads
            Resource: !GetAtt BucketSprawy.Arn
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaAplikacji}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaKopii}"

  # Powiadomienie o kazdej zmianie polityki bucketa - jedynej drogi do
  # zdjecia zakazu powyzej.
  TematZabezpieczen:
    Type: AWS::SNS::Topic
    Condition: MamyEmail
    Properties:
      TopicName: notarai-zabezpieczenia-spraw
      DisplayName: notarai zabezpieczenia
      Tags:
        - Key: projekt
          Value: notarai

  PolitykaTematu:
    Type: AWS::SNS::TopicPolicy
    Condition: MamyEmail
    Properties:
      Topics:
        - !Ref TematZabezpieczen
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridge
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref TematZabezpieczen
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt RegulaZmianyPolityki.Arn

  SubskrypcjaZabezpieczen:
    Type: AWS::SNS::Subscription
    Condition: MamyEmail
    Properties:
      TopicArn: !Ref TematZabezpieczen
      Protocol: email
      Endpoint: !Ref EmailZabezpieczen

  RegulaZmianyPolityki:
    Type: AWS::Events::Rule
    Condition: MamyEmail
    Properties:
      Name: notarai-zmiana-polityki-bucketa
      Description: Zmiana lub usuniecie polityki bucketa spraw
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - s3.amazonaws.com
          eventName:
            - PutBucketPolicy
            - DeleteBucketPolicy
          requestParameters:
            bucketName:
              - !Ref BucketSprawy
      Targets:
        - Arn: !Ref TematZabezpieczen
          Id: powiadomienie

  # Minimalne uprawnienia roli aplikacji: sprawy w S3 + Bedrock przez profile eu.
  # Profile eu.* kieruja ruch do kilku regionow UE, wiec foundation-model
  # musi byc dozwolony w kazdym z nich (inaczej AccessDenied).
  PolitykaAplikacji:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: notarai-aplikacja
      Description: notarai - dostep aplikacji do bucketa spraw i modeli Bedrock w UE
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SprawyS3
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              # Usuniecie sprawy na zadanie kancelarii: kasujemy takze starsze
              # wersje, inaczej zostalyby w buckecie mimo "usuniecia".
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetObjectVersion
            Resource: !Sub "${BucketSprawy.Arn}/*"
          - Sid: ListaS3
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
            Resource: !GetAtt BucketSprawy.Arn
          - Sid: KmsDlaBucketa
            Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: !If [WlasnyKlucz, !GetAtt KluczSpraw.Arn, !Ref KluczKms]
          - Sid: BedrockProfileEU
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub "arn:aws:bedrock:eu-central-1:${AWS::AccountId}:inference-profile/eu.*"
              - "arn:aws:bedrock:eu-central-1::foundation-model/*"
              - "arn:aws:bedrock:eu-west-1::foundation-model/*"
              - "arn:aws:bedrock:eu-west-3::foundation-model/*"
              - "arn:aws:bedrock:eu-north-1::foundation-model/*"
              - "arn:aws:bedrock:eu-south-1::foundation-model/*"
              - "arn:aws:bedrock:eu-south-2::foundation-model/*"
          # Stenogramy aktow (stenogramy.py): rozpoznawanie mowy tylko we Frankfurcie.
          # Audio i wynik leza w tym buckecie (stenogramy-robocze/), aplikacja kasuje
          # je zaraz po zapisaniu zanonimizowanego stenogramu.
          - Sid: TranscribeStenogramyEU
            Effect: Allow
            Action:
              - transcribe:StartTranscriptionJob
              - transcribe:GetTranscriptionJob
              - transcribe:DeleteTranscriptionJob
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
          - Sid: BedrockOdczyt
            Effect: Allow
            Action:
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource: "*"

Outputs:
  KluczSpraw:
    Description: ARN klucza KMS spraw (PIECZAPP_KMS_KEY_ID moze tez wskazywac alias/notarai-sprawy)
    Value: !If [WlasnyKlucz, !GetAtt KluczSpraw.Arn, !Ref KluczKms]
  Bucket:
    Description: Nazwa bucketa - ustaw jako PIECZAPP_S3_BUCKET
    Value: !Ref BucketSprawy
  PolitykaArn:
    Description: ARN polityki - dolacz do roli instancji App Runner / roli zadania ECS
    Value: !Ref PolitykaAplikacji
