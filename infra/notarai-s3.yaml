AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - bucket S3 na sprawy kancelarii (tryb SaaS, PIECZAPP_MAGAZYN=s3)
  oraz polityka IAM dla roli aplikacji (App Runner / ECS). Region: eu-central-1.
  Bucket przechowuje dane osobowe klientow kancelarii - utworzenie stosu wymaga
  swiadomej decyzji (patrz CLAUDE.md).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  NazwaBucketa:
    Type: String
    Default: notarai-sprawy
    Description: Nazwa bucketa (globalnie unikalna, tylko male litery, cyfry i myslniki)
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
  KluczKms:
    Type: String
    Default: ""
    Description: >-
      Opcjonalny ARN klucza KMS (CMK). Pusty = szyfrowanie SSE-S3 (AES256).
      Musi odpowiadac PIECZAPP_KMS_KEY_ID w aplikacji.
  RolaAplikacji:
    Type: String
    Default: notarai-ecs-zadanie
    Description: Nazwa roli zadania ECS (stos notarai-aplikacja) - jedynej, ktora czyta sprawy.
  RolaKopii:
    Type: String
    Default: notarai-kopia
    Description: Nazwa roli AWS Backup (stos notarai-kopia) - kopiuje i odtwarza sprawy.
  EmailZabezpieczen:
    Type: String
    Default: ""
    Description: >-
      Adres na powiadomienie o zmianie lub usunieciu polityki bucketa. Pusty =
      bez powiadomienia (zmiana i tak zostaje w CloudTrail).

Conditions:
  UzyjKms: !Not [!Equals [!Ref KluczKms, ""]]
  MamyEmail: !Not [!Equals [!Ref EmailZabezpieczen, ""]]

Resources:
  BucketSprawy:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref NazwaBucketa
      # Dane kancelarii NIGDY nie moga byc publiczne.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Kazdy obiekt szyfrowany; wersjonowanie pozwala cofnac nadpisanie.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: !If [UzyjKms, true, false]
            ServerSideEncryptionByDefault: !If
              - UzyjKms
              - SSEAlgorithm: aws:kms
                KMSMasterKeyID: !Ref KluczKms
              - SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: sprzatanie-starych-wersji
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: porzucone-uploady
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: projekt
          Value: notarai
        - Key: dane-osobowe
          Value: "tak"

  # Wymuszenie TLS - zadnego dostepu po zwyklym HTTP. Tresc spraw czyta
  # wylacznie aplikacja i kopia zapasowa: zakaz obejmuje kazdego innego,
  # takze administratorow konta i uzytkownika root (umowa powierzenia § 5
  # ust. 3 i 6). Zdjecie zakazu wymaga zmiany tej polityki, a to zostaje
  # w CloudTrail i wysyla powiadomienie (RegulaZmianyPolityki).
  PolitykaBucketa:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketSprawy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TylkoTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BucketSprawy.Arn
              - !Sub "${BucketSprawy.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: TrescSprawTylkoDlaAplikacji
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectVersionForReplication
              - s3:GetObjectTorrent
              - s3:PutObject
              - s3:GetObjectAttributes
            Resource: !Sub "${BucketSprawy.Arn}/kancelarie/*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaAplikacji}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaKopii}"
          # Nazwy plikow to tez dane: skany nazywaja sie nazwiskami stron.
          - Sid: SpisPlikowTylkoDlaAplikacji
            Effect: Deny
            Principal: "*"
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:ListBucketMultipartUploads
            Resource: !GetAtt BucketSprawy.Arn
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaAplikacji}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RolaKopii}"

  # Powiadomienie o kazdej zmianie polityki bucketa - jedynej drogi do
  # zdjecia zakazu powyzej.
  TematZabezpieczen:
    Type: AWS::SNS::Topic
    Condition: MamyEmail
    Properties:
      TopicName: notarai-zabezpieczenia-spraw
      DisplayName: notarai zabezpieczenia
      Tags:
        - Key: projekt
          Value: notarai

  PolitykaTematu:
    Type: AWS::SNS::TopicPolicy
    Condition: MamyEmail
    Properties:
      Topics:
        - !Ref TematZabezpieczen
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridge
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref TematZabezpieczen
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt RegulaZmianyPolityki.Arn

  SubskrypcjaZabezpieczen:
    Type: AWS::SNS::Subscription
    Condition: MamyEmail
    Properties:
      TopicArn: !Ref TematZabezpieczen
      Protocol: email
      Endpoint: !Ref EmailZabezpieczen

  RegulaZmianyPolityki:
    Type: AWS::Events::Rule
    Condition: MamyEmail
    Properties:
      Name: notarai-zmiana-polityki-bucketa
      Description: Zmiana lub usuniecie polityki bucketa spraw
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - s3.amazonaws.com
          eventName:
            - PutBucketPolicy
            - DeleteBucketPolicy
          requestParameters:
            bucketName:
              - !Ref BucketSprawy
      Targets:
        - Arn: !Ref TematZabezpieczen
          Id: powiadomienie

  # Minimalne uprawnienia roli aplikacji: sprawy w S3 + Bedrock przez profile eu.
  # Profile eu.* kieruja ruch do kilku regionow UE, wiec foundation-model
  # musi byc dozwolony w kazdym z nich (inaczej AccessDenied).
  PolitykaAplikacji:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: notarai-aplikacja
      Description: notarai - dostep aplikacji do bucketa spraw i modeli Bedrock w UE
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SprawyS3
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              # Usuniecie sprawy na zadanie kancelarii: kasujemy takze starsze
              # wersje, inaczej zostalyby w buckecie mimo "usuniecia".
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetObjectVersion
            Resource: !Sub "${BucketSprawy.Arn}/*"
          - Sid: ListaS3
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
            Resource: !GetAtt BucketSprawy.Arn
          - !If
            - UzyjKms
            - Sid: KmsDlaBucketa
              Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Ref KluczKms
            - !Ref AWS::NoValue
          - Sid: BedrockProfileEU
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub "arn:aws:bedrock:eu-central-1:${AWS::AccountId}:inference-profile/eu.*"
              - "arn:aws:bedrock:eu-central-1::foundation-model/*"
              - "arn:aws:bedrock:eu-west-1::foundation-model/*"
              - "arn:aws:bedrock:eu-west-3::foundation-model/*"
              - "arn:aws:bedrock:eu-north-1::foundation-model/*"
              - "arn:aws:bedrock:eu-south-1::foundation-model/*"
              - "arn:aws:bedrock:eu-south-2::foundation-model/*"
          - Sid: BedrockOdczyt
            Effect: Allow
            Action:
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource: "*"

Outputs:
  Bucket:
    Description: Nazwa bucketa - ustaw jako PIECZAPP_S3_BUCKET
    Value: !Ref BucketSprawy
  PolitykaArn:
    Description: ARN polityki - dolacz do roli instancji App Runner / roli zadania ECS
    Value: !Ref PolitykaAplikacji
