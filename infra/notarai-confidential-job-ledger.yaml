AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NotarAI synthetic Confidential Browser preview job lifecycle only.
  This standalone stack creates a separate minimal DynamoDB table and
  grants NO existing application role permissions.
Parameters:
  TenantId:
    Type: String
    Default: pilot01
    AllowedPattern: "^[a-z0-9]{1,12}$"
Resources:
  PreviewJobs:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "notarai-confidential-jobs-${TenantId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TenantCreatedAtIndex
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - job_id
              - state
              - attempts
              - updated_at
              - lease_until
              - submitted
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: NotarAI
        - Key: Scope
          Value: confidential-synthetic-preview
Outputs:
  JobTableName:
    Value: !Ref PreviewJobs
  JobTableArn:
    Value: !GetAtt PreviewJobs.Arn
  JobControlRoomIndexName:
    Value: TenantCreatedAtIndex
  JobStreamArn:
    Value: !GetAtt PreviewJobs.StreamArn
