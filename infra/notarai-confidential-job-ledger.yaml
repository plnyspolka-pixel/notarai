AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NotarAI synthetic Confidential Browser preview job lifecycle only.
  This standalone stack creates a separate minimal DynamoDB table and
  grants NO existing application role permissions.
Parameters:
  TenantId:
    Type: String
    Default: pilot01
    AllowedPattern: "^[a-z0-9]{1,12}$"
Resources:
  PreviewJobs:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "notarai-confidential-jobs-${TenantId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: NotarAI
        - Key: Scope
          Value: confidential-synthetic-preview
Outputs:
  JobTableName:
    Value: !Ref PreviewJobs
  JobTableArn:
    Value: !GetAtt PreviewJobs.Arn
