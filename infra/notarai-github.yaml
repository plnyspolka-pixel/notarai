AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - wdrazanie z GitHub Actions bez logowania do AWS. GitHub dostaje
  krotkotrwale poswiadczenia przez OIDC (bez kluczy dostepu), wylacznie dla
  galezi master repozytorium plnyspolka-pixel/notarai. Rola GitHuba buduje
  obraz i zleca CloudFormation aktualizacje stosu notarai-aplikacja; zmiany
  w zasobach wykonuje osobna rola CloudFormation.

  Wdraza administrator konta raz: infra\4-polacz-github.ps1

Parameters:
  Repozytorium:
    Type: String
    Default: plnyspolka-pixel/notarai
    Description: Repozytorium GitHub (wlasciciel/nazwa), z ktorego wolno wdrazac
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  Galaz:
    Type: String
    Default: master
    Description: Jedyna galaz, z ktorej wolno wdrazac
  UtworzDostawceOidc:
    Type: String
    Default: "tak"
    AllowedValues: ["tak", "nie"]
    Description: >-
      "nie", gdy w koncie juz jest dostawca token.actions.githubusercontent.com
      (moze byc tylko jeden na konto). Skrypt 4-polacz-github.ps1 sprawdza to sam.

Conditions:
  NowyDostawca: !Equals [!Ref UtworzDostawceOidc, "tak"]

Resources:
  DostawcaOidc:
    Condition: NowyDostawca
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS nie sprawdza juz odciskow dla GitHuba, ale pole bywa wymagane.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: projekt
          Value: notarai

  # Rola, ktora przyjmuje workflow .github/workflows/wdrozenie.yml.
  RolaGithub:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-github-wdrozenie
      Description: notarai - GitHub Actions buduje obraz i aktualizuje stos aplikacji
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - NowyDostawca
                - !Ref DostawcaOidc
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Tylko push/uruchomienie na galezi master. Pull requesty
                # i inne galezie nie dostana poswiadczen.
                token.actions.githubusercontent.com:sub: !Sub "repo:${Repozytorium}:ref:refs/heads/${Galaz}"
      Policies:
        - PolicyName: wdrazanie
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PaczkaZrodel
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::notarai-zrodla-${AWS::AccountId}/notarai/*"
              - Sid: Budowanie
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/notarai-obraz"
              - Sid: LogiBudowania
                Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/notarai-obraz:*"
              - Sid: Obrazy
                Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/notarai"
              - Sid: StosAplikacji
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/notarai-aplikacja/*"
              - Sid: OdczytStosuBudowania
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/notarai-budowanie/*"
              - Sid: WalidacjaSzablonu
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                Resource: "*"
              # Zmiany zasobow wykonuje rola CloudFormation, nie GitHub.
              - Sid: PrzekazanieRoliCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RolaCloudFormation.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: SprawdzenieWydania
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/notarai/*"
              - Sid: SprawdzenieDefinicji
                Effect: Allow
                Action: ecs:DescribeTaskDefinition
                Resource: "*"

  # Rola, ktora CloudFormation wykonuje zmiany w stosie notarai-aplikacja.
  # Zakres: wylacznie zasoby z prefiksem notarai.
  RolaCloudFormation:
    Type: AWS::IAM::Role
    Properties:
      RoleName: notarai-cloudformation
      Description: notarai - CloudFormation aktualizuje stos notarai-aplikacja na zlecenie GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: stos-aplikacji
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Ecs
                Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:UpdateCluster
                  - ecs:UpdateClusterSettings
                  - ecs:DeleteCluster
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:TagResource
                  - ecs:UntagResource
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/notarai"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/notarai/*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/notarai:*"
              # Te operacje ECS nie przyjmuja konkretnego zasobu.
              - Sid: EcsDefinicje
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:ListTagsForResource
                Resource: "*"
              - Sid: RoleAplikacji
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/notarai-ecs-*"
              - Sid: PrzekazanieRolEcs
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/notarai-ecs-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: RoleSerwisowe
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
              - Sid: Siec
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeInternetGateways
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:UpdateSecurityGroupRuleDescriptionsIngress
                  - ec2:UpdateSecurityGroupRuleDescriptionsEgress
                  - ec2:ModifySecurityGroupRules
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: "*"
              - Sid: LoadBalancer
                Effect: Allow
                Action: elasticloadbalancing:*
                Resource:
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/notarai/*"
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/notarai/*"
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener/app/notarai/*"
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/notarai/*"
              - Sid: LoadBalancerOdczyt
                Effect: Allow
                Action:
                  - elasticloadbalancing:Describe*
                  - acm:DescribeCertificate
                Resource: "*"
              - Sid: SekretAdmina
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:GetRandomPassword
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:notarai/admin-token*"
              - Sid: Losowanie
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: "*"
              - Sid: Logi
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/notarai*"
              - Sid: LogiOdczyt
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Alarmy
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:notarai-*"
              - Sid: SubskrypcjeOdczyt
                Effect: Allow
                Action:
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                Resource: "*"
              - Sid: AlarmyCloudWatch
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:notarai-*"
              - Sid: Budzet
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ListTagsForResource
                Resource: !Sub "arn:aws:budgets::${AWS::AccountId}:budget/notarai-*"

Outputs:
  RolaGithubArn:
    Description: Rola przyjmowana przez .github/workflows/wdrozenie.yml
    Value: !GetAtt RolaGithub.Arn
  RolaCloudFormationArn:
    Description: Rola, ktora CloudFormation aktualizuje stos notarai-aplikacja
    Value: !GetAtt RolaCloudFormation.Arn
