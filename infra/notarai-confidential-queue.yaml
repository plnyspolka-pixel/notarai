AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  notarai - opt-in EU-only SQS metadata queue and narrowly scoped enqueue policy
  for confidential preview tasks; no task is launched automatically.
Parameters:
  TenantId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_-]{1,32}$"
    Description: One dedicated test tenant
  ExistingAppRoleName:
    Type: String
    Default: notarai-ecs-zadanie
    Description: Existing NotarAI application task role
Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "notarai-confidential-${TenantId}-dead.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  PreviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "notarai-confidential-${TenantId}.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
  ApplicationEnqueuePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "notarai-confidential-${TenantId}-enqueue"
      Roles:
        - !Ref ExistingAppRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt PreviewQueue.Arn
Outputs:
  QueueArn:
    Value: !GetAtt PreviewQueue.Arn
  QueueUrl:
    Value: !Ref PreviewQueue
  DeadLetterQueueArn:
    Value: !GetAtt DeadLetterQueue.Arn
